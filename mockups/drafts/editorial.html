<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF">
<title>Публикации — IQONS</title>

<style>

/* ------------------------------------------------------------------
   FONT SLOT — one face per size tier. Put files in ../../assets/fonts/
   using these names; any single format is enough (woff2/woff/otf/ttf).

     title-regular.*   Т1  22px  заголовки
     title-bold.*      Т1  bold (optional)
     mid-regular.*     Т2  12px  основной — навигация, кнопки, названия
     mid-bold.*        Т2  bold (optional)
     small-regular.*   Т3  10px  мелкий — счётчики, артикулы, сноски
     mono-regular.*    ASCII layer (fixed width, must have Cyrillic)

   Each tier falls back to PT Serif on its own, so you can test one
   face at a time without the others in place.
   ------------------------------------------------------------------ */
@font-face{font-family:'IQONS Title';font-weight:400;font-style:normal;font-display:swap;
  src:url('../../assets/fonts/title-regular.woff2') format('woff2'),
      url('../../assets/fonts/title-regular.woff')  format('woff'),
      url('../../assets/fonts/title-regular.otf')   format('opentype'),
      url('../../assets/fonts/title-regular.ttf')   format('truetype');}
@font-face{font-family:'IQONS Title';font-weight:700;font-style:normal;font-display:swap;
  src:url('../../assets/fonts/title-bold.woff2') format('woff2'),
      url('../../assets/fonts/title-bold.woff')  format('woff'),
      url('../../assets/fonts/title-bold.otf')   format('opentype'),
      url('../../assets/fonts/title-bold.ttf')   format('truetype');}
@font-face{font-family:'IQONS Mid';font-weight:400;font-style:normal;font-display:swap;
  src:url('../../assets/fonts/mid-regular.woff2') format('woff2'),
      url('../../assets/fonts/mid-regular.woff')  format('woff'),
      url('../../assets/fonts/mid-regular.otf')   format('opentype'),
      url('../../assets/fonts/mid-regular.ttf')   format('truetype');}
@font-face{font-family:'IQONS Mid';font-weight:700;font-style:normal;font-display:swap;
  src:url('../../assets/fonts/mid-bold.woff2') format('woff2'),
      url('../../assets/fonts/mid-bold.woff')  format('woff'),
      url('../../assets/fonts/mid-bold.otf')   format('opentype'),
      url('../../assets/fonts/mid-bold.ttf')   format('truetype');}
@font-face{font-family:'IQONS Small';font-weight:400;font-style:normal;font-display:swap;
  src:url('../../assets/fonts/small-regular.woff2') format('woff2'),
      url('../../assets/fonts/small-regular.woff')  format('woff'),
      url('../../assets/fonts/small-regular.otf')   format('opentype'),
      url('../../assets/fonts/small-regular.ttf')   format('truetype');}
@font-face{font-family:'IQONS Mono';font-weight:400;font-style:normal;font-display:swap;
  src:url('../../assets/fonts/mono-regular.woff2') format('woff2'),
      url('../../assets/fonts/mono-regular.woff')  format('woff'),
      url('../../assets/fonts/mono-regular.otf')   format('opentype'),
      url('../../assets/fonts/mono-regular.ttf')   format('truetype');}

/* ============================================================
   IQONS +  ·  Template 01 — Shop grid
   Cross variant: TANEK  (Best Swashed — тонкий)
   No glass, no rounded corners. Photographs used as they are.
   Interface text from IQONS_interface_texts_RU_filled.xlsx.
   ============================================================ */

:root{
  --paper:#FFFFFF;
  --ink:#000000;
  --ink-55:#000000;
  --ink-30:#000000;
  --ink-12:#000000;

  /* type — three sizes (spec/type-scale.md, 19.08.2026)
     Т1 заголовок · Т2 основной · Т3 мелкий                */
  --t1:clamp(20px,1.8125vw,27.5px);   /* 16 Sep: Title face +25% (was 16/1.45vw/22) */
  --t2:clamp(13.75px,1.0625vw,15px);  /* 16 Sep: Title face +25% (was 11/.85vw/12) */
  --t1m:clamp(16px,1.45vw,22px);        /* the Mid face at the OLD Т1 size — hybrids only */
  --t2m:clamp(11px,.85vw,12px);         /* the Mid face at the OLD Т2 size — hybrids only */
  --t3:clamp(9.5px,.8vw,10.5px);
  /* tracking — one knob per tier. Every uppercase interface string in a
     tier shares its tier's value; the few deliberate variations are
     expressed as offsets so one change still moves them together. */
  --tr1:.02em;      /* Т1 headings            */
  --tr2:-.005em;    /* Т2 interface, capitals — Illustrator −5 */
  --tr2p:.01em;     /* Т2 paragraphs          */
  --tr3:-.010em;    /* Т3 small capitals — Illustrator −10 */

  /* each size tier carries its own face */
  /* EXPERIMENT 23.08.2026 — tiers shifted up one face:
     Т1 and Т2 both set in Mephisto, Т3 in Century. Corbel is left
     declared but unused, so this reverts by editing these three lines. */
  --font-t1:'IQONS Title',"PT Serif",Georgia,serif;
  --font-t2:'IQONS Title',"PT Serif",Georgia,serif;
  --font-t3:'IQONS Mid',"PT Serif",Georgia,serif;
  --font-mono:'IQONS Mono',ui-monospace,"SF Mono",Menlo,monospace;
  /* the logo is a two-line lockup (IQONS over 2009) — at the Т1 height
     the date is illegible, so it gets its own size */
  --logo-h:clamp(26.25px,2.625vw,42.5px);   /* 16 Sep: logo +25% (was 21/2.1vw/34) */

  /* grid — one gutter on both axes, so the module stays
     square and the lattice can register to it */
  --margin:clamp(14px,2vw,38px);
  --gap:clamp(14px,2vw,38px);
  --cell:60px;         /* lattice pitch — set by JS */
  --lat-x:center;
  --lat-y:center;
  --padT:var(--margin); --padB:14px;
  --headerH:calc(var(--margin) + var(--logo-h) + 14px);
  --shotRatio:1.5;                                  /* 1200x1800 on every frame */
  --pane:min(calc((100svh - var(--headerH) - var(--gapBottom)) / var(--shotRatio)), 36vw);
  --cols:4;
  --gapBottom:19px;           /* ≈0.5cm under the preview, at all times */
  --ease:cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{box-sizing:border-box}
/* ₽ as artwork rather than a font glyph — it renders identically whatever
   face Т2 ends up being, and takes its colour and size from the text */
.rub{height:.72em; width:auto; display:inline-block; vertical-align:-.005em; fill:currentColor}
/* no faked bold/italic — if a weight is missing, show what exists */
html{font-synthesis-weight:none; font-synthesis-style:none}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%; overscroll-behavior-y:none}
body{overscroll-behavior-y:none}
body{
  background:var(--paper); color:var(--ink);
  font-size:var(--t2); font-family:var(--font-t2); line-height:1.4;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}

/* ---------- background lattice ---------- */
.lattice{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2760%27%20height%3D%2760%27%20viewBox%3D%270%200%2060%2060%27%3E%3Cg%20transform%3D%27translate%2830%2C30%29%20scale%280.676%29%20translate%28-12%2C-12%29%27%20fill%3D%27none%27%20stroke%3D%27%23000000%27%20stroke-opacity%3D%271%27%3E%3Cpath%20d%3D%27M12%203.6C12.15%208.4%2012.15%2015.6%2012%2020.4%27%20stroke-width%3D%27.75%27%20stroke-linecap%3D%27round%27%2F%3E%3Cpath%20d%3D%27M3.6%2012C8.4%2011.85%2015.6%2011.85%2020.4%2012%27%20stroke-width%3D%27.75%27%20stroke-linecap%3D%27round%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
  background-size:var(--cell) var(--cell);
  background-position:var(--lat-x) var(--lat-y);
}

/* ---------- header ---------- */
header{
  position:fixed; top:0; left:0; right:0; z-index:200;
  display:flex; align-items:center;
  padding:var(--padT) var(--margin) var(--padB);
  pointer-events:none;
  /* No band at all — the page runs straight underneath, the way SSENSE does it.
     The header never changes size and nothing in it answers the pointer: it is
     a fixed set of marks that the photographs pass behind. --headerH still
     reserves its height, so the page starts below it and only slides under
     once you scroll. */
  background:none;
}
header > *{pointer-events:auto}

/* every box on the page has sharp corners */
.seg{display:flex; border:1px solid var(--ink); background:none}
.seg a{
  font-size:var(--t2); font-family:var(--font-t2); letter-spacing:var(--tr2); text-transform:uppercase;
  color:var(--ink); text-decoration:none; padding:7px 15px 6px; white-space:nowrap;
  border-right:1px solid var(--ink);
}
.seg a:last-child{border-right:0}
.seg a[aria-current]{background:var(--ink); color:var(--paper)}

.wordmark{
  position:absolute; left:50%; top:var(--padT); transform:translateX(-50%);
  font-size:var(--t1); font-family:var(--font-t1); font-weight:400; letter-spacing:calc(var(--tr1) + .10em); line-height:1.2; white-space:nowrap;
  padding:2px 14px;
  display:flex; align-items:center;
}
.wordmark .cross{font-weight:400; opacity:.7; margin-left:.14em}
/* PNG wordmark from ../../assets/logo/. Height is tied to the Т1 tier so the
   logo and the headings stay in proportion; --logo-h overrides it alone.
   The typed wordmark stays in the markup and comes back if the file is
   missing, so the header is never empty. */
.wordmark img{display:block; height:var(--logo-h,var(--t1)); width:auto; max-width:42vw}
.wordmark .wm-text{display:none}
.wordmark.no-logo img{display:none}
.wordmark.no-logo .wm-text{display:inline}
.right{margin-left:auto; display:flex; gap:10px}

/* ---------- shell ---------- */
.shell{
  position:relative; z-index:10;
  display:grid; grid-template-columns:var(--pane) 1fr; gap:var(--gap);
  /* no left padding: the photograph runs to the screen edge, the way the
     product page's stage runs to the right edge */
  padding:var(--headerH) var(--margin) var(--gapBottom) 0;
  transition:grid-template-columns .62s var(--ease), padding .62s var(--ease);
}
/* closed: the grid takes the margin back so it never sits against the edge */
.shell.is-closed{grid-template-columns:0px 1fr; --cols:6; padding-left:var(--margin)}

/* ---------- the window ---------- */
.pane{position:relative}
.pane-inner{
  position:fixed; top:var(--headerH); left:0; width:var(--pane);
  height:calc(100svh - var(--headerH) - var(--gapBottom)); min-height:300px;
}
.window{
  position:relative; height:100%; overflow:hidden;
  background:var(--paper);
  transform-origin:14% 24%;
  transition:opacity .42s var(--ease), transform .5s var(--ease);
}
.shell.is-closed .window{opacity:0; transform:scale(.96); pointer-events:none}

/* Overlay read-out, same chip language as the product page's frame counter:
   paper tabs laid on the image, hairline-divided, hugging the bottom-left.
   Two fixed rows rather than free wrapping — the name alone is wider than half
   the column, so a single flowing row tore into ragged fragments. */
.hud{position:absolute; left:0; bottom:0; z-index:4; display:flex; flex-direction:column;
     align-items:flex-start; max-width:100%; pointer-events:none}
.hudrow{display:flex; max-width:100%; min-width:0}
.hudrow > *{font-size:var(--t3); font-family:var(--font-t3); letter-spacing:var(--tr3);
  text-transform:uppercase; background:var(--paper); color:var(--ink-55);
  padding:5px 10px 4px; line-height:1.35; margin:0; white-space:nowrap;
  border-top:1px solid var(--ink-12); border-right:1px solid var(--ink-12)}
.hudrow > *:last-child{border-right:0}
.hud .nm{overflow:hidden; text-overflow:ellipsis; min-width:0}
.hud .sizes{display:flex; gap:8px}
.hud .sizes i{font-style:normal}
.hud .sizes i.out{text-decoration:line-through}   /* struck = out of stock */
.hud .xbtn{pointer-events:auto; cursor:pointer; border-bottom:0; border-left:0;
  font:inherit; font-size:var(--t3); font-family:var(--font-t3); color:var(--ink);
  transition:background .18s var(--ease), color .18s var(--ease)}
.hud .xbtn:hover{background:var(--ink); color:var(--paper)}
.hud .xbtn:focus-visible{outline:1px solid var(--ink); outline-offset:-3px}

.wstage{position:absolute; inset:0}
.wstage img{
  position:absolute; inset:0; width:100%; height:100%;
  /* whole garment, uncropped — the pane is cut to the shot ratio above, so
     this normally fills it edge to edge; any slack stays on the right */
  object-fit:contain; object-position:left center; display:block;
  opacity:0; transition:opacity .34s var(--ease);
}
.wstage img.on{opacity:1}


/* ---------- shop head ---------- */
.gridwrap{min-width:0; padding-top:14px}
.gridhead{display:flex; align-items:baseline; gap:22px 22px; flex-wrap:wrap; margin:0 0 18px}
.sections{display:flex; gap:18px}
.sections a{
  font-size:var(--t2); font-family:var(--font-t2); letter-spacing:var(--tr2); text-transform:uppercase;
  color:var(--ink-55); text-decoration:none; padding-bottom:0; border-bottom:1px solid transparent;
  transition:color .2s var(--ease), border-color .2s var(--ease);
}
.sections a[aria-current]{color:var(--ink); border-bottom-color:var(--ink)}
.sections a:hover{color:var(--ink)}
.para{font-size:var(--t2); font-family:var(--font-t2); letter-spacing:var(--tr2p); line-height:1.75; text-transform:none;
       color:var(--ink-55); max-width:46ch; margin:0}
.gridhead h1{font-size:var(--t1); font-family:var(--font-t1); font-weight:400; letter-spacing:var(--tr1); margin:0; flex-basis:100%}
.count{font-size:var(--t3); font-family:var(--font-t3); color:var(--ink-30); font-style:italic}
.tools{margin-left:auto; display:flex; gap:18px}
.tool{
  font:inherit; font-size:var(--t2); font-family:var(--font-t2); letter-spacing:var(--tr2); text-transform:uppercase;
  border:0; background:none; padding:0; cursor:pointer; color:var(--ink-55);
  border-bottom:1px solid transparent; transition:color .2s var(--ease), border-color .2s var(--ease);
}
.tool:hover{color:var(--ink); border-bottom-color:var(--ink)}

/* ---------- grid ---------- */
.grid{display:grid; grid-template-columns:repeat(var(--cols),minmax(0,1fr)); gap:var(--gap)}
.card{display:flex; flex-direction:column; cursor:pointer; background:none; border:0; padding:0;
      font:inherit; color:inherit; text-align:left}
.card:focus-visible{outline:1px solid var(--ink); outline-offset:6px}

/* 1:1.5 portrait — the photographs' native ratio, so nothing is cropped */
.tile{position:relative; width:100%; aspect-ratio:1/1.5; min-height:0; overflow:hidden}
.tile img{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:center 42%; display:block;
  transition:opacity .4s var(--ease);
}
.card:hover .tile img{opacity:.86}
/* outline, not an ::after overlay — the overlay appearing at load left
   the first card's photo on a stale paint layer and it rendered blank */
.card.is-active .tile{outline:1px solid var(--ink); outline-offset:-1px}
.badge{
  position:absolute; left:0; top:0; z-index:2;
  font-size:var(--t3); font-family:var(--font-t3); letter-spacing:var(--tr3); text-transform:uppercase;
  background:var(--ink); color:var(--paper); padding:4px 8px 3px;
}
.meta{padding:13px 0 0; display:flex; flex-direction:column; gap:4px}
.meta .nm{font-size:var(--t2); font-family:var(--font-t2); letter-spacing:var(--tr2); text-transform:uppercase; line-height:1.45}
.meta .pr{font-size:var(--t2); font-family:var(--font-t2); color:var(--ink-55)}
.meta .so{font-size:var(--t3); font-family:var(--font-t3); color:var(--ink-30); font-style:italic}

/* ---------- reopen ---------- */
.reopen{
  position:fixed; left:var(--margin); bottom:var(--margin); z-index:45;
  font:inherit; font-size:var(--t3); font-family:var(--font-t3); letter-spacing:calc(var(--tr3) + .02em); text-transform:uppercase; color:var(--ink);
  cursor:pointer; border:1px solid var(--ink); padding:8px 14px; background:var(--paper);
  opacity:0; transform:translateY(8px); pointer-events:none;
  transition:opacity .3s var(--ease), transform .3s var(--ease), background .2s var(--ease);
}
.shell.is-closed ~ .reopen{opacity:1; transform:none; pointer-events:auto}
.reopen:hover{background:var(--ink); color:var(--paper)}

/* ---------- footer ---------- */
/* out of the layout until stage two, so the page can never scroll past
   the content and cannot bounce */
footer{
  display:none;
  margin:var(--gapBottom) 0 0; padding:0;   /* nothing under the closing rule: the page ends with the footer */
  border-top:1px solid var(--ink);
  flex-wrap:wrap; align-items:baseline;
  position:relative;
  z-index:200;
  background-color:var(--paper);
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2760%27%20height%3D%2760%27%20viewBox%3D%270%200%2060%2060%27%3E%3Cg%20transform%3D%27translate%2830%2C30%29%20scale%280.676%29%20translate%28-12%2C-12%29%27%20fill%3D%27none%27%20stroke%3D%27%23000000%27%20stroke-opacity%3D%271%27%3E%3Cpath%20d%3D%27M12%203.6C12.15%208.4%2012.15%2015.6%2012%2020.4%27%20stroke-width%3D%27.75%27%20stroke-linecap%3D%27round%27%2F%3E%3Cpath%20d%3D%27M3.6%2012C8.4%2011.85%2015.6%2011.85%2020.4%2012%27%20stroke-width%3D%27.75%27%20stroke-linecap%3D%27round%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
  background-size:var(--cell) var(--cell);
  background-position:var(--lat-x) var(--lat-y);
  background-attachment:fixed;   /* register to the viewport, like .lattice */
}
footer.revealed{display:flex}
footer nav{
  flex:1 1 100%; display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 20px;
  padding:5px var(--margin) 0;
}
footer a{
  font-size:var(--t2); font-family:var(--font-t2); letter-spacing:var(--tr2); text-transform:uppercase;
  color:var(--ink-55); text-decoration:none;
}
footer a:hover{color:var(--ink)}
footer .rights{
  flex:1 1 100%; text-align:center; font-size:var(--t3); font-family:var(--font-t3); color:var(--ink-30);
  padding:34px var(--margin) 5px; border-bottom:1px solid var(--ink);
}

/* ---------- breakpoints ---------- */
@media (max-height:820px){ :root{--margin:clamp(12px,1.4vw,22px); --gap:clamp(12px,1.6vw,26px)} }
@media (min-width:2100px){ :root{--cols:6} .shell.is-closed{--cols:9} }
@media (min-width:1700px) and (max-width:2099px){ :root{--cols:5} .shell.is-closed{--cols:8} }
@media (max-width:1180px){ :root{--pane:min(calc((100svh - var(--headerH) - var(--gapBottom)) / var(--shotRatio)), 32vw); --cols:3} .shell.is-closed{--cols:5} }
@media (max-width:900px){
  :root{--cols:3}
  header{position:static; flex-wrap:wrap; gap:14px; justify-content:center; padding-bottom:6px}
  .shell{grid-template-columns:1fr; padding-top:var(--margin); padding-left:var(--margin)}
  .shell.is-closed{grid-template-columns:1fr; --cols:3}
  .wordmark{position:static; transform:none; order:-1}
  .right{margin-left:0}
  .pane{position:fixed; inset:0; z-index:60; display:none; padding:var(--margin)}
  .pane.modal-open{display:block}
  .pane::before{content:""; position:absolute; inset:0; background:rgba(0,0,0,.34)}
  .pane-inner{position:relative; top:0; left:auto; width:auto; height:100%; transform:none !important}
  .shell.is-closed .window{opacity:1; transform:none; pointer-events:auto}
  .reopen{display:none}
  .tools{margin-left:0; flex-basis:100%}
  footer nav{justify-content:flex-start}
}
@media (max-width:560px){ :root{--cols:2} .shell.is-closed{--cols:2} }
@media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important; animation-duration:.01ms !important} }

/* ================= TEST BUILD =================
   Fixed column counts: 3 while the preview is on screen, 4 when it is closed.
   The closed block reuses the open state's tile width and centres, so the
   tiles hold their size instead of ballooning into the reclaimed space. */
:root{
  --openGridW:calc(100vw - var(--margin) - var(--pane) - var(--gap));
  --openCol:calc((var(--openGridW) - 2 * var(--gap)) / 3);
  --closedW:calc(4 * var(--openCol) + 3 * var(--gap));
}
@media (min-width:901px){
  :root{--cols:3 !important}
  /* Closed: drop the shell's side padding AND the column gap the collapsed
     preview leaves behind, otherwise the block centres inside its column
     rather than on the screen and sits one gap off to the right. */
  .shell.is-closed{--cols:4 !important; gap:0; padding-left:0; padding-right:0}
  .shell.is-closed .grid{
    width:min(calc(100% - 2 * var(--margin)), var(--closedW));
    margin-inline:auto;
  }
}

/* ---------- TEST: product images at 50% ----------
   The photograph is sized from the tile's WIDTH and its own 1.5 ratio, so it
   no longer depends on the tile's height. That frees --tileR to control the
   vertical rhythm on its own: it is the tile box's height as a multiple of its
   width. 1.5 was the old full-bleed value; 1 closes the vertical distance
   between rows by roughly half without touching the columns.

   The caption is pulled up to meet the image and the same amount is given back
   below, so the card height stays a pure function of --tileR. Percentages on
   margin and padding resolve against WIDTH, which is why these are written as
   shares of the tile's width rather than its height. */
:root{--shot:.5; --tileR:1}
.tile{aspect-ratio:1 / var(--tileR)}
.tile img{
  inset:auto; top:50%; left:50%;
  width:calc(var(--shot) * 100%); height:auto;
  aspect-ratio:1 / var(--shotRatio);
  transform:translate(-50%,-50%);
}
.badge{
  left:calc((1 - var(--shot)) * 50%);
  top:calc((var(--tileR) - var(--shot) * var(--shotRatio)) / 2 / var(--tileR) * 100%);
}
.meta{
  margin-top:calc((var(--tileR) - var(--shot) * var(--shotRatio)) / 2 * -100%);
  padding-bottom:calc((var(--tileR) - var(--shot) * var(--shotRatio)) / 2 * 100%);
  /* the caption belongs to the photograph, not to the tile box it sits in:
     same width, same left edge, so it reads as one object */
  width:calc(var(--shot) * 100%);
  margin-inline:auto;
}
/* One step down the scale - T3's size, but the T2 face is kept so only the
   size changes and not the voice. The line boxes stay pinned to the T2 metrics
   so the caption block reserves exactly the height it did before. */
.meta .nm{font-size:calc(var(--t3) * 1.25); line-height:calc(1.45 * var(--t2))}   /* 16 Sep: Title face +25% */
.meta .pr{font-size:calc(var(--t3) * 1.25); line-height:calc(1.4 * var(--t2))}
/* the hover marker has to hug the photograph, not the tile box around it */
.card.is-active .tile{outline:0}
.card.is-active .tile img{outline:1px solid var(--ink); outline-offset:0}
.card:focus-visible{outline:0}
.card:focus-visible .tile img{outline:1px solid var(--ink); outline-offset:6px}

/* Lift so the first row's PHOTOGRAPH meets the heading text, rather than the
   empty top of its tile box; shift so the rightmost photograph lands on the
   screen edge. Both distances are measured at runtime because they are shares
   of the tile's width, which CSS cannot reach from margin or height. */
.grid{transform:translateX(var(--gridShift, 0px))}
/* The shifted tile boxes hang past the right edge. body{overflow-x:hidden} is
   already in the base stylesheet and clips them without a scrollbar — do NOT
   add overflow to html here. Doing so moves overflow propagation from body to
   the root, which leaves body as its own scroll container carrying
   overscroll-behavior-y:none; wheel scrolling then dies at body and never
   chains to the viewport, so the page cannot be scrolled by hand at all
   (window.scrollTo still works, which makes it easy to miss). */

/* ---------- TEST: single-line shop head ----------
   The season blurb and the item count are dropped. h1 carried flex-basis:100%,
   which is what forced the break onto a second line — releasing it lets the
   heading, the sections and the tools share one row. */
/* clearance between MAGAZIN's baseline and the top of the first product row */
:root{--rowsClear:2mm}
.para{display:none}
.count{display:none}
@media (min-width:901px){
  .gridhead{flex-wrap:nowrap; align-items:center; margin:0}
  .gridhead h1{flex-basis:auto; white-space:nowrap}
  .sections, .tools{white-space:nowrap}
}

/* ---------- TEST: columns placed by hand ----------
   The tile stops being an oversized box with a small photograph floating in the
   middle of it and becomes the photograph's own box. That is what lets the
   column gap BE the gap between photographs — with the old model the smallest
   achievable gap was a whole half-tile, so "no space at all" was unreachable.
   Track width and both gaps are written from script: they derive from --photoW,
   which is itself a share of a column width, and that is circular in CSS. */
:root{
  --photoW:calc(var(--shot) * var(--openCol));
  --rowSpace:150px;                 /* photo bottom to next photo top, as before */
}
.grid{justify-content:end}
.tile{aspect-ratio:1 / var(--shotRatio)}
.tile img{inset:0; width:100%; height:100%; aspect-ratio:auto; transform:none; object-fit:cover}
.badge{left:0; top:0}
.meta{width:100%; margin-top:0; margin-inline:0; padding-bottom:0}

/* The photograph size from the first test build: a full column wide, where the
   later builds cut it to half. --openCol is that same column, so the size
   carries over by derivation. Three of them fit across the anchored span. */
:root{--photoW:var(--openCol)}
@media (min-width:901px){
  :root{--cols:3 !important}
  .shell.is-closed{--cols:3 !important}
}

:root{--photoGap:0px}

.lattice{z-index:100}

/* ---------- header tightened, rows lifted onto the preview's top line -------
   --headerH is deliberately NOT reduced. It is what positions and sizes the
   preview, and the preview is settled, so it keeps its original value and is
   measured with .tight removed. The header just renders smaller inside that
   reserve, which frees the lower part of the band for the МАГАЗИН row. */
header{align-items:flex-start}
header.tight{--padT:8px; --padB:8px; --logo-h:30px}
header.tight .seg a{padding:4px 12px 3px}



/* ---------- draft shell: the finals' right-edge anchoring, without a preview --- */
.page{position:relative; z-index:10; padding:var(--headerH) 0 var(--gapBottom) var(--margin)}
.phead{display:flex; align-items:center; gap:22px; flex-wrap:nowrap; margin:0;
       padding-right:var(--margin)}
.phead h1{font-size:var(--t1); font-family:var(--font-t1); font-weight:400;
          letter-spacing:var(--tr1); margin:0; white-space:nowrap}
.phead .links{display:flex; gap:18px; white-space:nowrap}
.phead .links a{font-size:var(--t2); font-family:var(--font-t2); letter-spacing:var(--tr2);
  text-transform:uppercase; color:var(--ink-55); text-decoration:none;
  padding-bottom:0; border-bottom:1px solid transparent}
.phead .links a[aria-current]{color:var(--ink); border-bottom-color:var(--ink)}
.phead .tools{margin-left:auto; display:flex; gap:18px; white-space:nowrap}
.phead .tool{font:inherit; font-size:var(--t2); font-family:var(--font-t2);
  letter-spacing:var(--tr2); text-transform:uppercase; border:0; background:none;
  padding:0; cursor:pointer; color:var(--ink-55)}
.intro{font-size:var(--t2); font-family:var(--font-t2); letter-spacing:var(--tr2p);
  line-height:1.75; color:var(--ink-55); max-width:46ch; margin:26px 0 0}
.body-copy{font-size:var(--t2m); font-family:var(--font-t3); letter-spacing:var(--tr2p);
  line-height:1.85; color:var(--ink-55); max-width:52ch}
.body-copy p{margin:0 0 1.1em}
.lbl{font-size:var(--t3); font-family:var(--font-t3); letter-spacing:calc(var(--tr3) + .02em);
  text-transform:uppercase; color:var(--ink-55); display:block; margin-bottom:9px}
.rule{border:0; border-top:1px solid var(--ink-12); margin:0}
.btn{font:inherit; font-size:var(--t2); font-family:var(--font-t2);
  letter-spacing:calc(var(--tr2) + .02em); text-transform:uppercase;
  border:1px solid var(--ink); background:var(--ink); color:var(--paper);
  padding:15px 18px; cursor:pointer; display:inline-block; text-decoration:none;
  text-align:center}
.btn.ghost{background:none; color:var(--ink)}
.quiet{font-size:var(--t3); font-family:var(--font-t3); letter-spacing:var(--tr3);
  text-transform:uppercase; color:var(--ink-55); text-decoration:none;
  border-bottom:1px solid var(--ink-12)}
.note{font-size:var(--t3); font-family:var(--font-t3); color:var(--ink-30);
  font-style:italic; line-height:1.7}


/* ---------- editorial: the canvas -------------------------------------------
   sub.global's field, rebuilt in the DOM: a fixed full-viewport stage under the
   transparent header, one .world layer carrying the camera transform
   (translate to the viewport centre + pan, then scale = zoom) and one .card
   per frame positioned in world units. 1 world unit = 1 CSS px at zoom 1. */
.page.editorial{padding:0; min-height:100svh}
.stage{position:fixed; inset:0; z-index:1; overflow:hidden; background:var(--paper);
  cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none}
.stage.dragging{cursor:grabbing}
.stage.locked{pointer-events:none}
.world{position:absolute; left:0; top:0; width:0; height:0; will-change:transform}
/* the connectors live inside the card stack at z 0: dimmed cards are pushed to
   negative z-indexes, active ones sit at positive, so the crosses run over the
   background and under the grouped cards */
.links{position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible;
  pointer-events:none; z-index:0}
.links path{fill:none; stroke:#606060; stroke-width:1; vector-effect:non-scaling-stroke}
.cards{position:absolute; left:0; top:0; width:0; height:0; isolation:isolate; z-index:3}

/* OURS (16 Sep): none of their window chrome (dark bar, dot, outline, rounded
   corners) — the bare photograph, square-cornered, nothing written on it. Its
   data appears only when the images are grouped: the tag panel below. */
.card{position:absolute; margin:0; width:180px; background:none;
  cursor:pointer; will-change:transform; backface-visibility:hidden}
.card.inactive{cursor:default}
.cimg{position:absolute; left:0; top:0; width:180px; display:block;
  object-fit:cover; pointer-events:none; -webkit-user-drag:none}
/* films (22 Sep): the card is the poster frame with a small play mark and the
   running time; only the card in FOCUS gets a <video> (.cvid), which starts on
   the focusing click — a click on it again pauses / resumes. Leaving focus in
   any way stops and drops the video. Hairline progress along the bottom. */
.cvid{position:absolute; left:0; top:0; width:180px; height:100%; object-fit:cover; display:block;
  background:#000; pointer-events:none}
.cplay{position:absolute; left:7px; bottom:7px; z-index:1; width:0; height:0;
  border-left:8px solid #fff; border-top:5px solid transparent; border-bottom:5px solid transparent;
  filter:drop-shadow(0 0 1px rgba(0,0,0,.6)); transition:opacity .3s var(--ease)}
.cdur{position:absolute; left:19px; bottom:5px; z-index:1; font-family:var(--font-t3); font-size:7px;
  line-height:12px; letter-spacing:.04em; color:#fff; text-shadow:0 0 2px rgba(0,0,0,.7);
  transition:opacity .3s var(--ease)}
.card.playing .cplay, .card.playing .cdur{opacity:0}
.cprog{position:absolute; left:0; right:0; bottom:0; height:1px; z-index:1; display:none;
  background:rgba(255,255,255,.35)}
.cprog i{display:block; height:100%; width:0; background:#fff}
.card.focusvid .cprog{display:block}
.cveil{position:absolute; inset:0; background:var(--paper); opacity:1; pointer-events:none; z-index:2}   /* above the panel */
/* the tag panel below an expanded card: rows 12 units apart, the first 8 down,
   exactly where the reference anchors its connectors (8 + row·12) */
.ctags{position:absolute; left:0; top:100%; width:100%; height:81px; display:none;
  font-family:var(--font-t3); font-size:7px; line-height:12px; letter-spacing:.02em;
  color:var(--ink); text-transform:uppercase; white-space:nowrap}
.card.expanded .ctags, .card.grouped .ctags{display:block}
.card.expanded .cveil, .card.grouped .cveil{bottom:-81px}   /* the veil dims the panel too */
.ctags .row{position:absolute; left:0; right:0; height:12px; padding:0 5px}
.ctags .row .k{color:var(--ink-55); margin-right:6px}
.ctags .row i{position:absolute; top:5px; width:3px; height:3px; border-radius:50%;
  background:#606060; display:none}
.ctags .row i.l{left:-1px} .ctags .row i.r{right:-1px}
.ctags .row.linked i{display:block}

/* ---------- canvas chrome ------------------------------------------------------
   Categories: where the shop keeps its gender filter — the header's left
   column, 10px under the site sections (the .slot's gap). The header is the
   chrome's and fixed, so the block is fixed too and its top is measured from
   the sitenav by JS. One row per category, the sitenav's own idiom.
   Image data: bottom-left. Clear + zoom: bottom-right, out of everyone's way. */
.cfilters{position:fixed; left:var(--margin); z-index:150; display:flex; flex-direction:column; gap:16px;
  /* a column along the left edge, starting 10px under the site sections
     (the shop's gender-filter spot), category names left out */
  top:var(--catTop, calc(var(--headerH) + 4px))}
.cfilters .grp{display:flex; flex-direction:column; align-items:flex-start; gap:3px; white-space:nowrap}
.cfilters button{display:block}
.cfilters button{font:inherit; font-size:var(--t3); font-family:var(--font-t3);
  letter-spacing:var(--tr3); text-transform:uppercase; color:var(--ink-55);
  background:none; border:0; border-bottom:1px solid transparent; padding:0; cursor:pointer;
  transition:color .2s var(--ease), border-color .2s var(--ease)}
.cfilters button:hover{color:var(--ink)}
.cfilters button[aria-pressed="true"]{color:var(--ink); border-bottom-color:var(--ink)}
.ctools{position:fixed; right:var(--margin); bottom:var(--gapBottom); z-index:150;
  display:flex; align-items:center; gap:18px}
.czoom{-webkit-appearance:none; appearance:none; width:120px; height:1px; background:var(--ink-30);
  outline:0; margin:0; cursor:pointer}
.czoom::-webkit-slider-thumb{-webkit-appearance:none; width:9px; height:9px; border-radius:50%;
  background:var(--ink); border:0}
.czoom::-moz-range-thumb{width:9px; height:9px; border-radius:50%; background:var(--ink); border:0}
.copen{position:fixed; left:var(--margin); bottom:var(--gapBottom); z-index:150;
  display:flex; flex-direction:column; gap:4px; opacity:0; pointer-events:none;
  transition:opacity .4s var(--ease)}
.copen.on{opacity:1; pointer-events:auto}
.copen span, .copen .tg{font-size:var(--t3); font-family:var(--font-t3); letter-spacing:var(--tr3);
  text-transform:uppercase; color:var(--ink-55); white-space:nowrap}
.copen .tg b{font-weight:400; color:var(--ink-30); display:inline-block; min-width:5.5em}
.copen #copen-name{color:var(--ink)}
.copen a{font-size:var(--t3); font-family:var(--font-t3); letter-spacing:var(--tr3);
  text-transform:uppercase; color:var(--ink); text-decoration:none; align-self:flex-start;
  border-bottom:1px solid var(--ink); margin-top:6px}
@media (max-width:900px){ .cfilters{display:none} }

/* ---------- site sections in the header --------------------------------------
   The landing's four destinations, standing where the shop's gender filter
   stands. They replace the page's own heading: the underlined one IS the page
   name. Same idiom as the section links (.links a), so nothing new to learn.
   padding-top puts the type where the gender filter's type sat — that box had
   7px of padding and a 1px border above its text. */
.sitenav{display:flex; gap:18px; white-space:nowrap; padding-top:8px}
.sitenav a{font-size:var(--t2); font-family:var(--font-t2); letter-spacing:var(--tr2);
  text-transform:uppercase; color:var(--ink-55); text-decoration:none;
  padding-bottom:0; border-bottom:1px solid transparent;
  transition:color .2s var(--ease), border-color .2s var(--ease)}
.sitenav a[aria-current]{color:var(--ink); border-bottom-color:var(--ink)}
.sitenav a:hover{color:var(--ink)}

/* ---------- footer on a short page ------------------------------------------
   The body is a column that fills the viewport and the page grows to take the
   slack, so when the footer is released on a page shorter than the screen it
   lands at the bottom edge, where the shop's does after its scroll, and not
   mid-screen under the last paragraph. On a long page the page is already
   taller than the slack and nothing changes. */
body{display:flex; flex-direction:column; min-height:100svh}
body > main{flex:1 0 auto}

/* the wordmark is the way home; it inherits everything and adds nothing */
.home{display:contents; color:inherit; text-decoration:none}

<script>
/* alignLattice() reaches for `root`, which the shop declares far above the
   slice we lift. Without it the ReferenceError aborted this whole script tag,
   so the header reserve never got measured either and --headerH stayed a raw
   calc() — which is what positions everything. */
const root = document.documentElement;
/* One lattice for the whole site: a fixed 60px cell, phase centred on the
   viewport. Each page used to register the crosses to its own content — the
   logo on the landing, the .info column on the product page, the product
   gutters on the shop grid — so the cell size AND the phase differed on every
   page, and the shop's changed again with every variant that altered its
   column pitch. Only colour and stacking differ per page now; the geometry is
   identical everywhere. */
const CELL = 60;
function latticeOrigin(){
  return { cell:CELL,
           x:((window.innerWidth  - CELL)/2) % CELL,
           y:((window.innerHeight - CELL)/2) % CELL };
}
function alignLattice(){
  const o=latticeOrigin();
  root.style.setProperty('--cell', o.cell+'px');
  root.style.setProperty('--lat-x', o.x.toFixed(3)+'px');
  root.style.setProperty('--lat-y', o.y.toFixed(3)+'px');
}
addEventListener('resize',alignLattice);
addEventListener('load',alignLattice);
alignLattice();

(function(){
  const wm = document.getElementById('wordmark'), img = wm.querySelector('img');
  const fail = () => wm.classList.add('no-logo');
  if(img.complete && img.naturalWidth === 0) fail();
  img.addEventListener('error', fail);
})();
(function(){
  const hdr=document.querySelector('header'), rt=document.documentElement;
  /* Measured rather than computed: the old calc() underestimated the real band
     by ~1.6px, which buried the frame's top border beneath it. Nothing toggles
     any more — the header is a constant. */
  function measure(){
    rt.style.setProperty('--headerH', Math.ceil(hdr.getBoundingClientRect().height)+'px');
  }
  measure();
  addEventListener('load', measure);
  addEventListener('resize', measure);
  if(document.fonts) document.fonts.ready.then(measure);
})();
</script>

<script>
(function(){
  const head=document.querySelector('.phead');
  if(!head) return;
  const cx=document.createElement('canvas').getContext('2d');
  function capTop(el){
    const s=getComputedStyle(el);
    const rg=document.createRange(); rg.selectNodeContents(el);
    const tr=rg.getBoundingClientRect();
    cx.font=`${s.fontStyle} ${s.fontWeight} ${s.fontSize} ${s.fontFamily}`;
    const M=cx.measureText('\u041D');
    return tr.top + M.fontBoundingBoxAscent - M.actualBoundingBoxAscent;
  }
  function align(){
    const groups=[head.querySelector('h1'), head.querySelector('.links'), head.querySelector('.tools')]
      .filter(Boolean)
      .map(box=>({box, text: box.matches('h1') ? box : box.querySelector('a,button')}))
      .filter(g=>g.text);
    if(!groups.length) return;
    groups.forEach(g=>{ g.box.style.transform=''; });
    const tops=groups.map(g=>capTop(g.text));
    groups.forEach((g,i)=>{ g.box.style.transform='translateY('+(tops[0]-tops[i]).toFixed(2)+'px)'; });
  }
  function settle(){ align(); requestAnimationFrame(align); setTimeout(align,120); setTimeout(align,400); }
  settle();
  addEventListener('resize', settle); addEventListener('load', settle);
  if(document.fonts) document.fonts.ready.then(settle);
})();
</script>


<script>
(function(){
  const foot=document.querySelector('footer');
  if(!foot) return;
  /* Two-stage scroll, as on the shop page, with one correction. The shop
     closes the footer when scrollY drops to (docMax - footer height): where the
     page was before the reveal, on a page that scrolls. A page SHORTER than
     the viewport does not become scrollable when the footer appears, so docMax
     stays 0 and that test reads 0 <= -height, which is never true: the footer
     could open and never close. So the reveal records where the page was, and
     the close test is simply "back there". Identical on a long page; correct
     on a short one. */
  let open=false, openedAt=0, prevAbs=0, lastT=0, blocked=false;
  const docMax=()=>document.documentElement.scrollHeight - innerHeight;
  const stacked=()=>matchMedia('(max-width:900px)').matches;
  function reveal(){
    if(open) return;
    open=true; blocked=false; openedAt=window.scrollY;
    foot.classList.add('revealed');
    requestAnimationFrame(()=>{ if(docMax() > openedAt) window.scrollTo({top:docMax(), behavior:'smooth'}); });
  }
  function close(){ if(!open) return; open=false; blocked=false; foot.classList.remove('revealed'); }
  addEventListener('wheel', e=>{
    if(stacked()) return;
    const now=performance.now(), abs=Math.abs(e.deltaY);
    const gap=now-lastT; lastT=now;
    const atEnd = window.scrollY >= docMax()-1;
    if(e.deltaY>0 && !open){
      if(atEnd){
        if(blocked && (abs > prevAbs + 1.5 || gap > 140)){ prevAbs=abs; reveal(); return; }
        blocked=true;
      } else blocked=false;
    } else if(e.deltaY<0){
      blocked=false;
      if(open && window.scrollY <= openedAt + 2) close();
    }
    prevAbs=abs;
  }, {passive:true});
  addEventListener('keydown', e=>{
    if(e.key==='End')  reveal();
    if(e.key==='Home'){ close(); window.scrollTo({top:0,behavior:'smooth'}); }
  });
})();
</script>


<script>
/* Click a frame and its shoot gathers: the proposal's own behaviour, where the
   chosen set comes forward enlarged and everything else blurs where it stands.
   Frames repeat across the mosaic, so the gathered row shows each distinct
   frame once. Positions are computed, not authored — the group is laid out as
   one justified row inside the same span the mosaic uses, so it lands on the
   right edge like everything else on the site. Esc or the scrim closes it. */
(function(){
  const mosaic=document.getElementById('mosaic'), scrim=document.getElementById('scrim');
  if(!mosaic) return;
  const cells=[...mosaic.querySelectorAll('.mcell')];
  let open=false;

  function inset(){
    const probe=document.createElement('div');
    probe.style.cssText='position:absolute;visibility:hidden;width:var(--mosaicInset)';
    document.body.appendChild(probe);
    const w=probe.getBoundingClientRect().width; probe.remove(); return w;
  }
  function ratioOf(c){ const r=c.getBoundingClientRect(); return r.width/r.height; }

  function close(){
    if(!open) return;
    open=false;
    mosaic.classList.remove('grouping');
    scrim.classList.remove('on');
    cells.forEach(c=>{ c.classList.remove('picked'); c.style.cssText=c.dataset.css||''; });
  }

  function group(shoot){
    // one tile per distinct frame, in mosaic order
    const seen=new Set(), pick=[];
    cells.forEach(c=>{ if(c.dataset.shoot===shoot && !seen.has(c.dataset.src)){
      seen.add(c.dataset.src); pick.push(c); } });
    if(!pick.length) return;

    const left=inset();
    /* clientWidth, not innerWidth: innerWidth counts the scrollbar, which put
       the gathered row 7px past the right edge. */
    const vw=document.documentElement.clientWidth;
    const span=vw - left;                               // same right-edge habit
    const ratios=pick.map(ratioOf);
    const h=span/ratios.reduce((a,b)=>a+b,0);
    const top=Math.max(80,(window.innerHeight-h)/2);

    cells.forEach(c=>{ if(!c.dataset.css) c.dataset.css=c.getAttribute('style')||''; });
    mosaic.classList.add('grouping');
    scrim.classList.add('on');
    open=true;

    let x=left;
    pick.forEach((c,i)=>{
      const w=h*ratios[i];
      c.classList.add('picked');
      c.style.left=x.toFixed(1)+'px';
      c.style.top=top.toFixed(1)+'px';
      c.style.width=w.toFixed(1)+'px';
      c.style.height=h.toFixed(1)+'px';
      x+=w;
    });
  }

  cells.forEach(c=>c.addEventListener('click', e=>{
    e.stopPropagation();
    if(open) close(); else group(c.dataset.shoot);
  }));
  scrim.addEventListener('click', close);
  addEventListener('keydown', e=>{ if(e.key==='Escape') close(); });
})();
</script>


<script>
/* The shop's band, on every page. The reserve is measured with the header at
   full size and only then is the header shrunk, so --headerH — and with it
   where the page starts — is exactly what it was before; the sections, the
   logo and the page's own row simply sit higher inside it, where the shop
   grid keeps them. Registered after the template's own measure(), so this
   value is the one that survives. */
(function(){
  const hdr=document.querySelector('header'), rt=document.documentElement;
  if(!hdr) return;
  function reserve(){
    hdr.classList.remove('tight');
    const full=Math.ceil(hdr.getBoundingClientRect().height);
    hdr.classList.add('tight');
    rt.style.setProperty('--headerH', full+'px');
  }
  reserve();
  addEventListener('load', reserve);
  addEventListener('resize', reserve);
  if(document.fonts) document.fonts.ready.then(reserve);
})();
</script>

/* ---- tiny tween engine: the four GSAP eases the reference uses ---- */
const EASE={
  'expo.out':   t=>t>=1?1:1-Math.pow(2,-10*t),
  'expo.inOut': t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
  'power1.inOut':t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
  'power2.out': t=>1-Math.pow(1-t,3),
  'linear':     t=>t
};
const tweens=[];
function to(obj, props, o){
  const keys=Object.keys(props);
  killTweensOf(obj, keys);
  const tw={obj, keys, from:{}, to:props, dur:(o.duration||0)*1000, delay:(o.delay||0)*1000,
            ease:EASE[o.ease||'linear'], onUpdate:o.onUpdate, onComplete:o.onComplete, t0:null, started:false};
  tweens.push(tw); return tw;
}
function killTweensOf(obj, keys){
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i]; if(tw.obj!==obj) continue;
    if(!keys){ tweens.splice(i,1); continue; }
    tw.keys=tw.keys.filter(k=>!keys.includes(k));
    if(!tw.keys.length) tweens.splice(i,1);
  }
}
function stepTweens(now){
  for(let i=0;i<tweens.length;i++){
    const tw=tweens[i];
    if(tw.t0===null) tw.t0=now;
    const el=now-tw.t0-tw.delay; if(el<0) continue;
    if(!tw.started){ tw.started=true; tw.keys.forEach(k=>tw.from[k]=tw.obj[k]); }
    const p=tw.dur>0?Math.min(1,el/tw.dur):1, e=tw.ease(p);
    tw.keys.forEach(k=>{ tw.obj[k]=tw.from[k]+(tw.to[k]-tw.from[k])*e; });
    if(tw.onUpdate) tw.onUpdate();
    if(p>=1){ tweens.splice(i,1); i--; if(tw.onComplete) tw.onComplete(); }
  }
}
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(lo,hi,v)=>Math.max(lo,Math.min(hi,v));

/* ---- environment ---- */
const fine=matchMedia('(pointer:fine)').matches;          // their `fr`: desktop
/* OURS (23 Sep): the field's size and centre are the STAGE's, not the
   window's. On the desktop they are the same box (the stage is fixed,
   inset:0). On a phone mobile.py makes the stage the whole SCREEN — --floor
   tall from the document's top, the runway's --inT above Safari's layout
   window and the bar's zone below it — so the rows run from under the header
   to the screen's bottom edge, behind the address bar, and every pointer
   coordinate is shifted into the stage's box (off). winTop/winBot = how much
   of the stage lies above / below the window, where the fixed header and
   the data line at the bottom actually are. */
function off(){ const r=stage.getBoundingClientRect(); return {x:-r.left,y:-r.top}; }
/* the layout's numbers come from the runway's height, not from the live
   rect: the stage's top is -inT by construction (mobile.py's 900px rule),
   and a resize that fires while the page is off its runway (a rotation, a
   bar change during an overscroll) must not lay the field out for a
   position it will not keep */
function winTop(){ return matchMedia('(max-width:900px)').matches?Math.max(0,cssPx('--inT')):0; }
function winBot(){ return Math.max(0,vh-winTop()-innerHeight); }
/* the stage's box, but never shorter than the floor on a phone: FLOOR_JS
   states --floor in px, and a box iOS has not re-laid-out yet must not win */
function stageH(){ let h=stage.clientHeight||innerHeight; if(matchMedia('(max-width:900px)').matches){ const f=cssPx('--floor'); if(f>h) h=f; } return h; }
let vw=stage.clientWidth||innerWidth, vh=stageH();
/* zoom.base/max are theirs and every formula reads them; zoom.floor is ours:
   the zoom the intro lands on (base + 0.25) is as far out as the user may go,
   so the field never shrinks below its starting placement. The filter view's
   own camera move may still dip to base to fit its grid. */
const zoom={base:.4, floor:.65, max:2.75, target:.4, cur:.4};
const introStep=()=>vw<768?.125:.25;
function bounds(){
  if(vw>=1024){ zoom.base=.4; zoom.max=2.75; } else { zoom.base=.3; zoom.max=2; }
  zoom.floor=zoom.base+introStep();
  slider.min=zoom.floor; slider.max=zoom.max;
}
bounds(); zoom.target=zoom.cur=zoom.base;
const progress=()=>(zoom.target-zoom.base)/(zoom.max-zoom.base);
let DIST=235, G=330;

/* ---- placement ----
   Their ring() is kept for reference; layout() is what runs: rows across the
   old mosaic's footprint (right edge to the quarter line, header to footer
   gap), each row a share of that span from the old EROWS table, flush right,
   so the left edge is ragged. Positions are computed in world units for the
   zoom the intro lands on, and recomputed on resize. */
const SHARES=[1.0,.86,1.0,.71,.95,.82,1.0,.68,.91];
function cssPx(name){ const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim(); const n=parseFloat(v); return isNaN(n)?0:n; }
function layout(){
  const z0=zoom.floor;
  /* the footprint the rows and the fit pass below are both mapped onto.
     DESKTOP: the old mosaic's box — right edge to the quarter line, under the
     header, above the footer gap. PHONE (23 Sep, the user's call): the whole
     SCREEN, at the screen's own size and aspect — full width, from the first
     row of pixels the window shows (winTop() = --inT, the runway's height) to
     the stage's bottom edge, so the field runs up behind the transparent
     header and the logo and down behind Safari's address bar the way the rest
     of the page does. The header gets no exclusion; the category column below
     still slides cards clear of itself, which is what keeps it readable. */
  const phone=matchMedia('(max-width:900px)').matches;
  const R=vw<768?9:7;
  const XL=phone?0:vw*.25, XR=phone?vw:vw-6;
  /* PHONE: from the STAGE's own top to its bottom — the stage IS the screen
     (mobile.py), so 0 is the screen's first row of pixels, behind the island,
     and vh its last, under the address bar. It used to start at winTop(), the
     window's top edge, which left the strip above it outside the field: the
     photographs stopped where Safari's window did and the strip showed the
     bare paper behind them ("white bars", the user, 23 Sep). */
  let top=phone?0:winTop()+(cssPx('--headerH')||66)+(cssPx('--gap')||24)+8,
      bottom=phone?vh:vh-(cssPx('--gapBottom')||19);
  /* PHONE (23 Sep, the user: "white bars over the top and bottom of this page"):
     the footprint above ends the first row's centres ON the screen's top pixel
     and the last row's ON its bottom one, so the strips Safari keeps above and
     below its window showed the stage's bare paper. Half a row of bleed at each
     end instead: row 1 straddles the top edge, row R the bottom, and the
     photographs run under the island and the address bar the way the crosses
     do. The rows in between are unchanged — the pitch is the same, the whole
     ladder is simply half a row taller at both ends. */
  if(phone){ const b=(bottom-top)/R/2; top-=b; bottom+=b; }
  const rowH=(bottom-top)/R;
  const shares=Array.from({length:R},(_,r)=>SHARES[r%SHARES.length]), S=shares.reduce((a,b)=>a+b,0);
  let counts=shares.map(s=>Math.round(cards.length*s/S));
  let diff=cards.length-counts.reduce((a,b)=>a+b,0);
  for(let r=0; diff!==0; r=(r+1)%R){ counts[r]+=Math.sign(diff); diff-=Math.sign(diff); }
  let k=0;
  counts.forEach((n,r)=>{
    const rowW=shares[r]*(XR-XL), pitch=rowW/n;
    for(let q=0;q<n;q++,k++){
      const c=cards[k]; if(!c) return;
      const sx=XR-(q+.5)*pitch+c.jx*.3*pitch, sy=top+(r+.5)*rowH+c.jy*.35*rowH;
      c.base.x=(sx-vw/2)/z0; c.base.y=(sy-vh/2)/z0;
    }
  });
  /* fit pass: the rows above place centres, but cards have size and jitter,
     so measure the real extent of the boxes and map it exactly onto the same
     footprint (XL/XR/top/bottom above: the desktop's box, or the phone's
     whole screen). */
  const box=c=>{ const hw=c.W*c.SCALE/2*z0, hh=c.H*c.SCALE/2*z0, x=vw/2+c.base.x*z0, y=vh/2+c.base.y*z0; return {l:x-hw,r:x+hw,t:y-hh,b:y+hh}; };
  const bb=cards.map(box);
  const L=Math.min(...bb.map(b=>b.l)), Rt=Math.max(...bb.map(b=>b.r)), T=Math.min(...bb.map(b=>b.t)), B=Math.max(...bb.map(b=>b.b));
  const fx=(XR-XL)/(Rt-L), fy=(bottom-top)/(B-T);
  cards.forEach((c,i)=>{
    const b=bb[i], cx=(b.l+b.r)/2, cy=(b.t+b.b)/2;
    const nx=XL+(cx-L)*fx, ny=top+(cy-T)*fy;
    c.base.x=(nx-vw/2)/z0; c.base.y=(ny-vh/2)/z0;
  });
  /* and nothing under the category block: a card that would overlap it slides
     right until it clears — only the first rows' leftmost cards ever do */
  const cr=filterBox.getBoundingClientRect(), oy=winTop(), cats={width:cr.width, right:cr.right, top:cr.top+oy, bottom:cr.bottom+oy};   // the fixed column, in stage px
  if(cats.width){
    cards.forEach(c=>{
      const b=box(c);
      if(b.l<cats.right+14 && b.t<cats.bottom+10 && b.b>cats.top-10){
        c.base.x+=(cats.right+14-b.l)/z0;
      }

}
function ring(i, e, t){
  if(i===0) return {x:0,y:0};
  let k=1; while(i>4*k*(k+1)) k++;              // ring k holds indices 1+4k(k-1) … 4k(k+1)
  const m=i-(1+4*k*(k-1)), side=2*k, s=Math.floor(m/side), q=m%side;
  const E=e*k, T=t*k;
  let x,y;
  if(s===0){ x=-E+q*(2*E/side); y= T; }         // top edge, left→right
  else if(s===1){ x= E; y= T-q*(2*T/side); }    // right edge, top→bottom
  else if(s===2){ x= E-q*(2*E/side); y=-T; }    // bottom, right→left
  else { x=-E; y=-T+q*(2*T/side); }             // left, bottom→top
  return {x, y:-y};                             // their y is up; ours is down
}

const cards=[...layer.querySelectorAll('.card')].map((el,idx)=>{
  const d=DATA[idx];
  const c={ i:d.i, el, d, W:180, H:180*d.ar, tags:d.tags,
    veil:el.querySelector('.cveil'),
    img:el.querySelector('.cimg'), rows:[...el.querySelectorAll('.ctags .row')],
    SCALE:1-Math.random()*.6, RX:-1+Math.random()*2, RY:-1+Math.random()*2,
    jx:-1+Math.random()*2, jy:-1+Math.random()*2, base:{x:0,y:0},
    U:{x:0,y:0,s:.25}, T:{x:0,y:0}, X:{cur:{x:0,y:0}, lerp:{x:0,y:0}},
    ee:{x:0,y:0,f:1}, sc:{v:1}, vl:{v:1}, dm:{v:0},
    offset:{x:0,y:0}, active:true, expanded:false, filterActive:false, view:'default',

[...cards].sort((a,b)=>a.SCALE-b.SCALE).forEach((c,rank)=>{ c.z=rank+1; c.el.style.zIndex=c.z; });
let zCounter=DATA.length+10;

function cardPos(c){  // where the card's centre is, in world units (their C.position + T + U)
  c.pos.x=c.base.x + c.X.lerp.x + c.ee.x + c.T.x + c.U.x;
  c.pos.y=c.base.y + c.X.lerp.y + c.ee.y + c.T.y + c.U.y;

}
/* dimmed cards mostly ignore the camera: while the group zooms out (or in),
   a compensation of (floor/zoom)^(0.9·dm) on both position and size keeps a
   background card near the size and place it had, dm easing 0→1 as it dims */
const DEPTH=.9;
function paint(c){
  const comp=c.dm.v>0?Math.pow(zoom.floor/zoom.cur, DEPTH*c.dm.v):1;
  const s=c.U.s*c.sc.v*comp;
  c.el.style.transform=`translate(${(c.pos.x*comp).toFixed(2)}px,${(c.pos.y*comp).toFixed(2)}px) scale(${s.toFixed(4)})`;
  c.veil.style.opacity=c.vl.v.toFixed(3);
}

/* ---- state ---- */
let view='default', prevView=null, selected=null, links=[], flip=Math.random();
/* OURS (22 Sep): `sel` is what is pressed in the column, any number of
   buttons — OR inside a category, AND across them (SS 25 + SS 26 + Видео =
   the films of both seasons); `drill` is the shoot group a card of that grid
   opened into, when the shoot has subgroups (null otherwise) */
let sel=[], drill=null;
let focus=null;              // OURS: one card of a group brought to the centre, the rest of the group dimmed
const FOCUS_SCALE=1.25;
let transitioning=false, introDone=false, hovered=null;
const mouse={x:0,y:0};                                    // their mouse2, normalised −1…1
const pan={x:0,y:0,tx:0,ty:0,locked:false};
/* the point the zoom keeps still: the cursor for wheel, the pinch midpoint for
   touch, the screen centre for the slider and for every camera move of ours */
const anchor={x:vw/2,y:vh/2};
const anchorCentre=()=>{ anchor.x=vw/2; anchor.y=vh/2; };
const camHome={x:0,y:0};   // where the filter view's camera settles; off-origin on a phone only
const drag={on:false, card:null, lastX:0, lastY:0, downT:0, moved:0};
let sliderActive=false;

/* ---- hover (their ye + raycast) ---- */
function setHover(c){
  if(hovered===c) return;
  if(hovered) hoverFx(hovered,false);
  hovered=c;
  if(hovered) hoverFx(hovered,true);
}
function hoverFx(c,on){
  const base=focus&&focus.card===c?FOCUS_SCALE:((view==='filter'&&c.filterActive)||c.expanded?1:c.SCALE);
  const bump=.05/clamp(.75,1,progress()*3);
  to(c.sc,{v:on&&view!=='node'?base+bump:base},{duration:1,ease:'expo.out'});
}
layer.addEventListener('mouseover',e=>{
  if(drag.on&&fine) return;                                 // keep the pressed card hovered
  const el=e.target.closest('.card'); const c=el?cards[+el.dataset.i]:null;
  setHover(c&&c.active?c:null);
});
layer.addEventListener('mouseleave',()=>{ if(!(drag.on&&fine)) setHover(null); });

/* ---- pointer: pan the field, or drag one card ---- */
function pt(e){ const o=off(); return e.touches?{x:e.touches[0].clientX+o.x,y:e.touches[0].clientY+o.y}:{x:e.clientX+o.x,y:e.clientY+o.y}; }
function inHeader(e){ return !!(e.target.closest && (e.target.closest('header')||e.target.closest('.ctools')||e.target.closest('.copen'))); }
function onMove(e){
  if(transitioning||inHeader(e)) return;
  const p=pt(e);
  mouse.x=(p.x/vw-.5)*2; mouse.y=(p.y/vh-.5)*2;
  if(drag.on && !(e.touches&&e.touches.length>1)){
    const dx=(p.x-drag.lastX)/zoom.target, dy=(p.y-drag.lastY)/zoom.target;
    drag.moved+=Math.abs(dx)+Math.abs(dy);
    if(drag.card){ drag.card.X.cur.x+=dx; drag.card.X.cur.y+=dy; }
    else if(!sliderActive && !pan.locked){
      const f=fine?1:1.35;
      pan.tx=clamp(-1600,1600,pan.tx+dx*f); const ymax=view==='filter'?Math.max(1000,Math.abs(camHome.y)):1000;   // a phone's tall filter grid reaches further
      pan.ty=clamp(-ymax,ymax,pan.ty+dy*f);
    }
    drag.lastX=p.x; drag.lastY=p.y;
  }
}
function onDown(e){
  if(transitioning||inHeader(e)) return;
  if(e.touches&&e.touches.length>1){ drag.on=false; return; }
  const p=pt(e);
  drag.on=true; drag.lastX=p.x; drag.lastY=p.y; drag.downT=e.timeStamp; drag.moved=0;
  const under=document.elementFromPoint(p.x,p.y), uel=under&&under.closest?under.closest('.card'):null;
  const uc=uel?cards[+uel.dataset.i]:null;
  if(fine&&uc!==hovered) setHover(uc&&uc.active?uc:null);
  drag.card=(fine&&uc&&uc.active)?uc:null;
  if(drag.card){ drag.card.z=++zCounter; drag.card.el.style.zIndex=drag.card.z; }
  stage.classList.add('dragging');
}
function onUp(e){
  if(!drag.on) return;
  drag.on=false; drag.card=null; stage.classList.remove('dragging');
  if(!fine) setHover(null);
}
stage.addEventListener('mousedown',onDown); addEventListener('mousemove',onMove); addEventListener('mouseup',onUp);
stage.addEventListener('touchstart',onDown,{passive:true}); addEventListener('touchmove',onMove,{passive:true}); addEventListener('touchend',onUp);
/* their window click counted only a QUICK press (<200ms), which threw away
   every unhurried click. OURS: a click is a press that did not travel — the
   press point is kept at window level, because the stage takes no pointer
   events while a transition runs and would never see the mousedown. */
const press={x:0,y:0};
function onPress(e){ const p=e.touches?e.touches[0]:e; if(p){ press.x=p.clientX; press.y=p.clientY; } }
addEventListener('mousedown',onPress,true); addEventListener('touchstart',onPress,{capture:true,passive:true});
/* the lit card under a point, by its box — works while the stage is locked too */
function activeCardAt(x,y){
  let hit=null;
  for(const c of cards){
    if(!c.active) continue;
    const r=c.el.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom&&(!hit||c.z>hit.z)) hit=c;
  }
  return hit;
}
/* a click that lands while a transition is still running is kept and answered
   the moment it ends (frame() flushes it), instead of being dropped */
let pendingBack=false;
function back(){                                              // focus → rows → shoot grid → season grid → the field
  if(focus) unfocus();
  else if(view==='node'&&sel.length) showGrid();
  else if(view==='filter'&&drill){ drill=null; showGrid(); }
  else reset();
}
addEventListener('click',e=>{
  if(inHeader(e)) return;
  if(e.target.closest('a,button,input')) return;
  if(Math.hypot(e.clientX-press.x,e.clientY-press.y)>6) return;  // that was a drag
  if(transitioning){
    if(view!=='default'&&!activeCardAt(e.clientX,e.clientY)) pendingBack=true;
    return;
  }
  const el=e.target.closest('.card'); let c=el?cards[+el.dataset.i]:null;
  /* in a group the dimmed cards are background: a click on one is an empty click */
  if(c&&!c.active&&view!=='default') c=null;
  if(!c){                                                   // empty space
    if(view!=='default') back();                            // anywhere around the group, the panels' gaps included
    else if(e.target.closest('#stage')) home();             // field → its start
    return;
  }
  if(!c.active) return;
  if(view==='filter'){                                        // a card in a grid goes one level down
    /* a shoot with subgroups opens its own grid first — unless that shoot
       alone is what the column already shows */
    const only=sel.filter(f=>f.k==='Съёмка');
    if(!drill&&!(only.length===1&&only[0].v===c.d.g)&&cards.some(o=>o.d.g===c.d.g&&o.d.sg)){ drill=c.d.g; showGrid(); return; }
    selectNode(c,c.d.sg?'sub':'shoot'); return;
  }
  if(view==='node'){                                          // a card in the rows: bring it forward, or open it
    if(focus&&focus.card===c){
      if(vid.el&&vid.card===c){ vid.el.paused?vid.el.play().catch(()=>{}):vid.el.pause(); return; }   // a film: play / pause
      document.getElementById('copen-link').click(); return;
    }
    focusCard(c); return;
  }
  selectNode(c);
});

/* ---- films (ours, 22 Sep): playable only while theirs is the one card in
   focus. startVideo() lays a <video> over the poster and plays it; every way
   out of focus ends in stopVideo() — unfocus() directly, the rest (Esc,
   a filter, a new node) through the check in frame(). ---- */
const vid={card:null, el:null};
function startVideo(c){
  stopVideo();
  const v=document.createElement('video'), bar=c.el.querySelector('.cprog i');
  v.className='cvid'; v.src='../../assets/editorial/'+c.d.video; v.poster=c.img.src;
  v.playsInline=true; v.setAttribute('playsinline',''); v.preload='auto';
  v.addEventListener('play',()=>c.el.classList.add('playing'));
  v.addEventListener('pause',()=>c.el.classList.remove('playing'));
  v.addEventListener('ended',()=>{ v.currentTime=0; c.el.classList.remove('playing'); });
  v.addEventListener('timeupdate',()=>{ if(bar&&v.duration) bar.style.width=(v.currentTime/v.duration*100).toFixed(2)+'%'; });
  c.img.after(v); c.el.classList.add('focusvid');
  vid.card=c; vid.el=v;
  v.play().catch(()=>{});
}
function stopVideo(){
  if(!vid.el) return;
  const c=vid.card, bar=c.el.querySelector('.cprog i');
  vid.el.pause(); vid.el.removeAttribute('src'); vid.el.load(); vid.el.remove();
  c.el.classList.remove('playing','focusvid'); if(bar) bar.style.width='0';
  vid.card=vid.el=null;
}

/* ---- focus (ours): in a group, a click on a card does not regroup — the card
   glides to the centre a little larger, the rest of its group dims exactly as
   the background did, the connectors fade, the camera comes to the node zoom.
   An empty click or Esc hands back to the group as it was. ---- */
function showData(c){
  openName.textContent=c.d.file;
  openTags.innerHTML=c.tags.filter(t=>t[0]!=='Файл').map(t=>`<div class="tg"><b>${t[0]}</b>${t[1]}</div>`).join('');
  openBox.classList.add('on');
}
function zoomTo(p,dur,done){
  const z={p:zoom.target};
  to(z,{p},{duration:dur,ease:'expo.inOut',onUpdate:()=>{ zoom.target=z.p; slider.value=z.p; },onComplete:done});
}
function focusCard(c){
  if(focus||transitioning) return;
  focus={card:c, group:cards.filter(o=>o.active&&o!==c), zoom:zoom.target};
  transitioning=true; stage.classList.add('locked'); anchorCentre();
  focus.group.forEach(o=>setActive(o,false));
  c.z=++zCounter; c.el.style.zIndex=c.z;
  to(c.U,{x:0,y:0},{duration:1,ease:'expo.inOut'});
  to(c.sc,{v:FOCUS_SCALE},{duration:1,ease:'expo.inOut'});
  links.forEach(l=>to(l.op,{v:0},{duration:.4,ease:'power2.out'}));
  pan.locked=true;
  to(pan,{x:0,y:0},{duration:1,ease:'expo.inOut',onComplete:()=>{ pan.tx=0; pan.ty=0; pan.locked=false; }});
  zoomTo(zoom.base+.75,.75,()=>{ transitioning=false; stage.classList.remove('locked'); });
  showData(c);
  if(c.d.video) startVideo(c);             // inside the click, so it may play with sound
}
function unfocus(){
  if(!focus||transitioning) return;
  const f=focus; focus=null; stopVideo();
  transitioning=true; stage.classList.add('locked'); anchorCentre();
  f.group.forEach(o=>setActive(o,true));
  to(f.card.U,{x:f.card.offset.x,y:f.card.offset.y},{duration:1,ease:'expo.inOut'});
  to(f.card.sc,{v:1},{duration:1,ease:'expo.inOut'});
  links.forEach(l=>to(l.op,{v:1},{duration:.5,delay:.6,ease:'power2.out'}));
  zoomTo(f.zoom,.75,()=>{ transitioning=false; stage.classList.remove('locked'); });
  pan.locked=true;
  to(pan,{x:camHome.x,y:camHome.y},{duration:1,ease:'expo.inOut',onComplete:()=>{ pan.tx=camHome.x; pan.ty=camHome.y; pan.locked=false; }});
  if(view==='node'&&selected) showData(selected); else openBox.classList.remove('on');
}
/* the starting position: pan, zoom and every dragged card back where the intro left them */
function home(){
  if(transitioning) return;
  anchorCentre();
  pan.locked=true;
  to(pan,{x:0,y:0},{duration:1,ease:'expo.inOut',onComplete:()=>{ pan.tx=0; pan.ty=0; pan.locked=false; }});
  const z={p:zoom.target};
  to(z,{p:zoom.floor},{duration:1,ease:'expo.inOut',onUpdate:()=>{ zoom.target=z.p; slider.value=z.p; }});
  cards.forEach(c=>to(c.X.cur,{x:0,y:0},{duration:1,ease:'expo.inOut'}));
}

/* ---- zoom: wheel, pinch, slider ---- */
stage.addEventListener('wheel',e=>{
  e.preventDefault(); e.stopPropagation();                 // the footer reveal must not fire here
  if(transitioning) return;
  const o=off(); anchor.x=e.clientX+o.x; anchor.y=e.clientY+o.y;
  zoom.target=clamp(zoom.floor,zoom.max,zoom.target-e.deltaY/750);
  slider.value=zoom.target;
},{passive:false});
let pinchD=0;
stage.addEventListener('touchstart',e=>{ if(e.touches.length===2) pinchD=Math.hypot(e.touches[0].pageX-e.touches[1].pageX,e.touches[0].pageY-e.touches[1].pageY); },{passive:true});
stage.addEventListener('touchmove',e=>{
  if(transitioning||e.touches.length!==2) return;
  const d=Math.hypot(e.touches[0].pageX-e.touches[1].pageX,e.touches[0].pageY-e.touches[1].pageY);
  const o=off(); anchor.x=(e.touches[0].clientX+e.touches[1].clientX)/2+o.x; anchor.y=(e.touches[0].clientY+e.touches[1].clientY)/2+o.y;
  zoom.target=clamp(zoom.floor,zoom.max,zoom.target+(d-pinchD)/750); pinchD=d; slider.value=zoom.target;
},{passive:true});
slider.addEventListener('input',()=>{ sliderActive=true; anchorCentre(); zoom.target=parseFloat(slider.value); });
slider.addEventListener('change',()=>{ sliderActive=false; });
slider.addEventListener('pointerup',()=>{ sliderActive=false; });

/* ---- camera moves on every view change (their U1: h() then f()) ---- */
function cameraFor(v){
  transitioning=true; stage.classList.add('locked'); anchorCentre();
  const z={p:zoom.target};
  killTweensOf(z);
  to(z,{p:v==='default'?zoom.floor:zoom.base},{duration:.75,ease:'expo.inOut',
    onUpdate:()=>{ zoom.target=z.p; slider.value=z.p; },
    onComplete:()=>{
      if(v==='node'){
        to(z,{p:nodeZoom},{duration:.75,delay:.25,ease:'expo.inOut',
          onUpdate:()=>{ zoom.target=z.p; slider.value=z.p; },
          onComplete:()=>{ transitioning=false; stage.classList.remove('locked'); }});
      } else { transitioning=false; stage.classList.remove('locked'); }
    }});
  /* and the field itself glides back to the origin (their P()) */
  pan.locked=true;
  const grp=v==='filter'||v==='node';
  const hx=grp?camHome.x:0, hy=grp?camHome.y:0;   // camHome: see showGrid and selectNode
  to(pan,{x:hx,y:hy},{duration:1,ease:'expo.inOut',onComplete:()=>{ pan.tx=hx; pan.ty=hy; pan.locked=false; }});
}

/* ---- active / dim (their Xe) ---- */
function setActive(c,on){
  if(c.active===on && introDone) return;
  c.active=on; c.el.classList.toggle('inactive',!on);
  if(on){ c.z=c.zSaved||c.z; c.el.style.zIndex=c.z; to(c.vl,{v:0},{duration:1,ease:'power2.out'}); to(c.dm,{v:0},{duration:.75,ease:'expo.inOut'}); }
  else { c.zSaved=c.z; c.el.style.zIndex=-(DATA.length-c.i); c.vl.v=.9; killTweensOf(c.vl); to(c.dm,{v:1},{duration:.75,ease:'expo.inOut'}); }
  if(hovered===c&&!on) setHover(null);
}

/* ---- the view switch every card answers to (their Je + ve) ---- */
function applyView(v){
  prevView=view; view=v;
  cards.forEach(c=>{
    const arranged=c.view!=='default';
    to(c.ee,{f:v==='default'?1:0},{duration:1,ease:'expo.inOut'});
    let dur=1;
    if(prevView&&prevView!=='default'&&v!=='default'&&!c.active) dur=0;
    const full=(v==='filter'&&c.filterActive)||c.expanded;
    to(c.sc,{v:full?1:c.SCALE},{duration:dur,ease:'expo.inOut'});
    if(arranged){
      to(c.T,{x:-(c.base.x+c.X.cur.x),y:-(c.base.y+c.X.cur.y)},{duration:dur,ease:'expo.inOut'});
      to(c.U,{x:c.offset.x,y:c.offset.y},{duration:dur,ease:'expo.inOut'});
    } else {
      to(c.T,{x:0,y:0},{duration:dur,ease:'expo.inOut'});
      to(c.U,{x:0,y:0},{duration:dur,ease:'expo.inOut'});
    }
    c.el.classList.toggle('expanded',c.expanded);
    c.el.classList.toggle('grouped',v==='filter'&&c.filterActive);   // data shows only when grouped
  });
  cameraFor(v);
  openBox.classList.toggle('on', v==='node');
  if(hovered) hoverFx(hovered,true);
}

/* ---- node view: the click ---- */
let nodeZoom=.4+.75;
/* the screen the node block may use, in CSS px: clear of the category column
   on both sides (so the block stays centred), of the header and of the data
   line at the bottom */
function nodeRoom(){
  const cats=filterBox.getBoundingClientRect(), side=cats.width?cats.right+24:24;
  /* the header and the data line sit in the WINDOW (fixed), so the room is
     measured from the window's edges, wherever the stage's own edges are */
  const top=winTop()+(cssPx('--headerH')||66)+(cssPx('--gap')||24), bottom=winBot()+(cssPx('--gapBottom')||19)+50;
  return {w:Math.max(200,vw-2*side), h:Math.max(200,vh-top-bottom)};
}
function pick(pool, pred, n){ return pool.filter(pred).slice(0,n); }
function tag(c,k){ const t=c.tags.find(t=>t[0]===k); return t?t[1]:''; }
function selectNode(c,level='shoot'){
  focus=null;
  selected=c; flip=Math.random();
  /* OURS (22 Sep, the user's call): only their horizontal rows — no children
     row on the far side. The clicked card stands at the left, its whole shoot
     GROUP (every photograph and film of the shoot, plus the one-file shoots
     paired with it in _src/publikacije.py) runs to the right in shoot order,
     in rows that zig-zag by G/2 exactly as their siblings / acquaintances
     rows do, each row chained card to card from the clicked one. Two rows as
     theirs; one for a group of three or fewer, up to four when that lets the
     camera come closer. The camera frames the block, never nearer than theirs. */
  /* Two levels where the user has picked SUBGROUPS inside a shoot
     (inbox/publikacije_2026-09-22/subgroups.json, picked on podgrupe.html):
     level 'shoot' gathers the whole group with one chained row per subgroup
     (frames in no subgroup share the rows after them); a click on a card of a
     subgroup then narrows to level 'sub', that subgroup alone in the rows
     above. A shoot with no subgroups has the one level. Since the column
     levels (22 Sep) a card of a subgroup comes here from its shoot's grid
     straight at level 'sub'. */
  const bySeq=(a,b)=>a.d.seq-b.d.seq;
  const members=cards.filter(o=>o!==c&&(level==='sub'?o.d.sg===c.d.sg:o.d.g===c.d.g)&&passes(o,typeSel())).sort(bySeq);
  const n=members.length, room=nodeRoom();
  const box=(pos,rows)=>{
    const all=[...pos].map(([o,q])=>({o,q}));
    const L=Math.min(...all.map(e=>e.q.x-90)), Rr=Math.max(...all.map(e=>e.q.x+90));
    const T=Math.min(...all.map(e=>e.q.y-e.o.H/2)), B=Math.max(...all.map(e=>e.q.y+e.o.H/2+81));
    return {rows, pos, L, Rr, T, B, fit:Math.min(room.w/(Rr-L),room.h/(B-T))};
  };
  const lay2=(rows)=>{                       // their zig-zag, for one or two rows
    const pos=new Map([[c,{x:0,y:0}]]), R=rows.length;
    rows.forEach((row,k)=>row.forEach((o,w)=>{
      const x=(k%2?1.2*G:G)+G*w;
      let Q=R===1?0:G/2-k*G; if(w%2) Q+=G/2;
      pos.set(o,{x,y:-Q});                   // their y is up
    }));
    return box(pos,rows);
  };
  const layN=(rows)=>{                       // three rows or more: stacked, a light zig-zag
    const pos=new Map([[c,{x:0,y:0}]]), R=rows.length;
    const PY=Math.max(...[c,...members].map(o=>o.H))+81+70;
    rows.forEach((row,k)=>row.forEach((o,w)=>{
      pos.set(o,{x:(k%2?1.2*G:G)+G*w, y:(k-(R-1)/2)*PY+(w%2?PY*.1:0)});
    }));
    return box(pos,rows);
  };
  const place=(rows)=>rows.length<=2?lay2(rows):layN(rows);
  const split=(list,R)=>{ const per=Math.ceil(list.length/R); return Array.from({length:R},(_,k)=>list.slice(k*per,(k+1)*per)).filter(r=>r.length); };
  let lay;
  const subs=level==='shoot'?[...new Set(members.concat(c).map(o=>o.d.sg).filter(Boolean))]:[];
  if(subs.length){
    /* the clicked card's own subgroup first, then the others in shoot order */
    subs.sort((a,b)=>(a===c.d.sg?-1:b===c.d.sg?1:0)||
      Math.min(...members.filter(o=>o.d.sg===a).map(o=>o.d.seq))-Math.min(...members.filter(o=>o.d.sg===b).map(o=>o.d.seq)));
    const rows=subs.map(s=>members.filter(o=>o.d.sg===s)).filter(r=>r.length);
    const rest=members.filter(o=>!o.d.sg);
    const longest=Math.max(1,...rows.map(r=>r.length));
    if(rest.length) rows.push(...split(rest,Math.ceil(rest.length/Math.max(longest,4))));
    lay=place(rows);
  } else {
    lay=place(split(members,n<=3?1:2));
    if(n>3) for(let R=3;R<=4;R++){ const l=place(split(members,R)); if(l.fit>lay.fit*1.08) lay=l; }
  }
  cards.forEach(o=>{ o.expanded=false; o.filterActive=false; o.view='default'; o.offset={x:0,y:0};
                     o.rows.forEach(r=>r.classList.remove('linked')); });
  lay.pos.forEach((q,o)=>{ o.offset={x:q.x,y:q.y}; o.expanded=true; o.view='node'; });
  cards.forEach(o=>setActive(o,o.expanded));
  nodeZoom=clamp(zoom.base,zoom.base+.75,lay.fit);
  camHome.x=-(lay.L+lay.Rr)/2; camHome.y=-(lay.T+lay.B)/2;
  /* connectors: selected→first→second… along each row, from tag row to tag
     row (row k of the block leaves from tag row k, as theirs) */
  links=[];
  lay.rows.forEach((row,k)=>{
    const chain=[c,...row];
    for(let q=0;q<chain.length-1;q++){
      const tr=k%3;                          // the tag row the chain leaves from (Съёмка / Тип / Сезон)
      links.push({a:chain[q], b:chain[q+1], mode:'lr', type:'row', active:false, isSingle:row.length<=1, row:tr, op:{v:0},
                  r1:.55+Math.random()*.95, r2:.55+Math.random()*.95});   // crosses differ in size
      if(LINK_STYLE==='curve'){ chain[q].rows[tr].classList.add('linked'); chain[q+1].rows[tr].classList.add('linked'); }
    }
  });
  drawLinks(true);
  links.forEach(l=>to(l.op,{v:1},{duration:.5,delay:1.5,ease:'power2.out'}));
  showData(c);
  applyView('node');
}
/* connector style: 'curve' (theirs, from tag row to tag row) or 'cross' (the
   user's option, kept for later). Either way they run over the dimmed cards
   and under the grouped ones. */
const LINK_STYLE='curve';
function drawLinks(rebuild){
