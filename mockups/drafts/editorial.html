  const frame=layer.querySelector('iframe');
  /* the runway: on a phone the page's origin is --inT down the document
     (mobile.py, THE RUNWAY AND THE BLEED); every rest position is that, not 0 */
  const T0=()=>parseFloat(getComputedStyle(rt).getPropertyValue('--inT'))||0;
  /* the travel is the layer's own height, not innerHeight: on a phone the
     layer is --floor tall (mobile.py, THE FLOOR) — the screen under Safari's
     bar, taller than the window — and the landing must leave ALL of it */
  const layerH=()=>Math.round(layer.getBoundingClientRect().height)||innerHeight;
  const DUR=950;
  const ease=t=>t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  let state=rt.classList.contains('landing-on') ? 'landing' : 'shop';
  if(state==='landing') window.scrollTo(0,T0());

  function run(from,to,apply,done){
    if(reduced.matches){ apply(to); done(); return; }
    const t0=performance.now();
    (function step(now){
      const p=Math.min(1,(now-t0)/DUR), v=from+(to-from)*ease(p);
      apply(v);
      if(p<1) requestAnimationFrame(step); else done();
    })(t0);
  }
  /* for the travel only: a spacer the landing's height above the shop, the
     landing lying in it, and the window really scrolled — so the shop's fixed
     header, preview and crosses behave exactly as on a scroll */
  const spacer=document.createElement('div');
  spacer.setAttribute('aria-hidden','true');
  function stage(H){
    /* before <main>, not at the body's start: on a phone the crosses and the
       standing motif are sticky boxes at the START of the body (mobile.py, THE
       FLOOR) and must stay registered to the screen while the shop rides up */
    spacer.style.height=H+'px'; document.body.insertBefore(spacer,document.querySelector('body > main')||document.body.firstChild);
    layer.style.cssText=`position:absolute; top:0; left:0; right:0; bottom:auto; height:${H}px`;
  }
  const to=y=>window.scrollTo({top:y,left:0,behavior:'instant'});
  function unstage(){ spacer.remove(); layer.style.cssText=''; to(T0()); }

  /* landing -> shop */
  function go(){
    if(state!=='landing') return;
    state='anim'; hold.on=true;
    const H=layerH();
    const T=T0();
    stage(H); to(T);
    run(T,H+T,to,()=>{
      rt.classList.remove('landing-on'); unstage(); state='shop';
      if(location.hash==='#landing') history.replaceState(null,'',location.pathname+location.search);
      try{ frame.blur(); }catch(_){}
    });
  }
  /* shop -> landing (the header logo). At the top of the shop it is the same
     travel run backwards; further down the landing comes down over the page
     and the shop is put back to its top behind it. */
  function back(){
    if(state!=='shop') return;
    state='anim';
    const H=layerH();
    rt.classList.add('landing-on');
    const T=T0();
    if(window.scrollY<=T+1){
      stage(H); to(H+T);
      run(H+T,T,to,()=>{ unstage(); state='landing'; });
    } else {
      run(-H,0,v=>{ layer.style.transform=`translateY(${v}px)`; },()=>{ layer.style.transform=''; to(T0()); state='landing'; });
    }
  }

  /* ---- input ---- */
  const hold={on:false, prev:0, t:0};
  const SCROLL_KEYS=new Set(['ArrowDown','ArrowUp','PageDown','PageUp',' ','Spacebar','End','Home']);
  const DOWN_KEYS=new Set(['ArrowDown','PageDown',' ','Spacebar','End']);
  function eat(e){ e.preventDefault(); e.stopImmediatePropagation(); }

  function onWheel(e){
    const now=performance.now(), abs=Math.abs(e.deltaY), gap=now-hold.t;
    hold.t=now;
    if(state==='landing'){ eat(e); if(e.deltaY>0) go(); hold.prev=abs; return; }
    if(state==='anim'){ eat(e); hold.prev=abs; return; }
    if(hold.on){
      /* momentum only decays: a delta that grows, or a pause, is a new push */
      if(gap>160 || abs>hold.prev+1.5) hold.on=false;
      else { eat(e); hold.prev=abs; return; }
    }
    hold.prev=abs;
  }
  let y0=null;
  function onTouchStart(e){
    if(state==='shop'){ hold.on=false; return; }
    y0=e.touches[0].clientY;
  }
  function onTouchMove(e){
    if(state==='shop') return;
    eat(e);
    if(state==='landing' && y0!==null && y0-e.touches[0].clientY>12){ y0=null; go(); }
  }
  function onKey(e){
    if(state==='shop') return;
    if(!SCROLL_KEYS.has(e.key) || e.target.closest?.('input,textarea,select')) return;
    eat(e);
    if(state==='landing' && DOWN_KEYS.has(e.key)) go();
  }
  function listen(w){
    w.addEventListener('wheel',onWheel,{capture:true,passive:false});
    w.addEventListener('touchstart',onTouchStart,{capture:true,passive:true});
    w.addEventListener('touchmove',onTouchMove,{capture:true,passive:false});
    w.addEventListener('keydown',onKey,{capture:true});
  }
  listen(window);

  /* inside the landing: its own gestures, and its links. Магазин is this page,
     so it runs the travel; the rest leave the whole window, not the frame.
     Wired as soon as the frame has a document, with one delegated click
     handler — NOT on the frame's load event, which waits for every image and
     font of the landing: a click before it navigated the FRAME to the other
     page, that page then lay inside the landing layer, and the first scroll
     after the late load carried it away to reveal the page underneath (the
     "duplicate collections page", 22 Sep). Should the frame ever hold anything
     but the landing, it is put back. */
  const SRC=frame.getAttribute('src'), HOME=new URL(SRC,location.href).pathname;
  function here(a,d){ return new URL(a.getAttribute('href'), d.baseURI).pathname===location.pathname; }
  function wire(){
    let w, d;
    try{ w=frame.contentWindow; d=frame.contentDocument; }catch(_){ return false; }
    if(!w || !d || !d.documentElement || w.location.href==='about:blank') return false;
    if(w.location.pathname!==HOME){ frame.src=SRC; return false; }
    if(w.__iqonsWired) return true;
    w.__iqonsWired=true;
    listen(w);
    d.addEventListener('click',e=>{
      const a=e.target.closest?.('a[href]'); if(!a) return;
      if(here(a,d)){ e.preventDefault(); go(); }
      else a.target='_top';
    },true);
    return true;
  }
  frame.addEventListener('load',wire);
  (function early(){ if(!wire()) requestAnimationFrame(early); })();

  /* the header logo */
  document.querySelectorAll('a.home').forEach(a=>{
    a.addEventListener('click',e=>{
      if(e.metaKey||e.ctrlKey||e.shiftKey||e.button) return;
      e.preventDefault(); back();
    });
  });
  addEventListener('hashchange',()=>{ if(location.hash==='#landing') back(); });
})();
</script>

     and NO_ASCII hides them again on every page but the two ASCII_KEEP holds. */
  .ascii-fx, .ascii-gl, .ascii-st{ display:block }

     stands on the floor stands on the screen's bottom edge on a still page
     (their heights are in --floor: ascii_place.py), and rides up with the
     page when the footer is swiped up. The product page's AT_JS overrides

     the layer's own height for it, not innerHeight. When the logo brings it
     down over a page scrolled away from its top, FLOOR_JS pins it fixed for
     the slide (cut on the bar for that second) and lets go at the top. */
  .landing{
    position:absolute; inset:0 0 auto 0; height:var(--floor);
    margin:0; flex:none;
  }
  /* ---------- THE CHROME'S COLOUR ----------
     Safari 26 no longer reads <meta name="theme-color"> (andesco/
     safari-color-tinting, 1ar.io, benfrain.com): its status bar and the
     surround of its address bar take the background-color of a
     position:fixed or sticky box within 4px of the top or 3px of the bottom,
     at least 80% wide and 3px tall — otherwise the body's. A hidden box is
     still read (visibility:hidden counts; display:none does not), which is
     where the black bands on a white page came from: the landing's fixed
     black layer, hidden but there, long after it had gone. Now the layers
     that reach the floor are absolute and never read, the landing is
     transparent while it is off (below, outside the query), and the two
     chips here ARE read and say what the page is: black under the landing
     and the Меню panel, gone (display:none — the body's paper is read)
     otherwise (below). */
  .tint{ position:fixed; left:0; width:100%; height:4px; z-index:2000;
         pointer-events:none; display:none; background:#000000 }
  .tint-t{ top:0 } .tint-b{ bottom:0 }
  /* Under the landing the top chip showed as a black LINE at the bottom of the
     status strip wherever it crossed the white motif (23 Sep, the user's phone),
     and Safari does not read it anyway (THE GLOW, below) — so no chips under
     the landing any more; only under the Меню panel, where they are black on
     black. Removed at the user's word, 23 Sep. */
  html.menu-lock .tint{ display:block }
  /* THE GLOW (23 Sep, parked at the user's word): over the black landing
     Safari keeps its status icons black and lays a white wash under the
     island — it reads the page as light. Two attempts, both REVERTED because
     each turned the landing's strips into black bars on the phone: 12px chips
     always in the tree (transparent when off), and `html.landing-on header
     {background:#000}` (the icons do go white in the Меню panel, whose header
     is black, so the header is what Safari reads). Deal with it last. */

  /* Under the Меню panel and under the shop's filter modal — both fixed, so
     both cut on the bar — the page beneath would show, faded, in the bar's
     zone. It is put out of sight there: the panel's zone is then plain black
     (html.menu-lock paints the body black; the inverted lattice runs on over
     it), the modal's plain paper. visibility, so nothing is re-laid-out. */
  html.menu-lock main, html.menu-lock footer, html.menu-lock .ascii-fx{ visibility:hidden }
  html.pane-modal main > :not(.pane), html.pane-modal footer,
  html.pane-modal .ascii-fx, html.pane-modal .lattice{ visibility:hidden }

  /* ---------- footer ----------
     In the layout from the start (22 Sep, the user: the swipe-to-open footer
     of 21 Sep — a touch handler, a display toggle and a smooth scroll on every
     swipe — made every still page lag). The desktop's two-stage reveal is a
     wheel handler that returns early under 901px, so `.revealed` never
     matters here: the page scrolls into the footer and back, natively, and
     nothing else moves. `main` is a full screen tall (--floor: the screen's
     bottom edge under Safari's bar, the same floor the motifs stand on — NOT
     lvh, which left the footer's first row showing through the bar on a still
     page, 22 Sep), so on a page that fits the screen the footer begins under
     the screen's bottom edge — the still page looks as it did, and a swipe
     brings the footer up OVER the standing motif, which stays where it is. */
  footer, footer.revealed{ display:flex }
  main{ min-height:calc(var(--floor) - var(--inT,0px)) }   /* runway + main = the screen */
  /* See-through: no paper and no tile of its own. The fixed ASCII layer (z 5)
     shows through it, and the lattice (z 100) runs over it as over the rest
     of the page — so the footer steps down under the lattice (the desktop's
     stands above it at 200 with its own copy of the tile). Its type gets the
     white ring where a motif runs behind it: ascii_legible.py, `phone`. */
  footer{ background:none; z-index:50 }
  footer .latclip{ display:none }   /* the page's crosses run over it: no second copy (23 Sep) */
  footer nav{
    display:grid; grid-template-columns:1fr 1fr; gap:11px 16px;
    justify-content:start; padding:12px var(--margin) 0;
  }
  footer .rights{ padding:26px var(--margin) 6px }
}

@media (max-width:900px){

     pinch it — so it is the filters that were missing: the inherited block hid
     the column outright. They come back as the desktop's column, hung straight
     under the «Меню» button on the same left margin: the field keeps its left

  .cfilters{

     simply gone — theirs is `hidden md:flex` — and the pinch is the zoom; and
     «Clear» is a mark in the header row, top-right, shown whenever a filter or
     a card is open. Ours took the same seat until 21 Sep, when the bar's right
     end went to Корзина on every page; it now hangs straight under it on the
     right margin, as the filter column hangs under the menu mark on the left.
     It is put away while the menu panel is open. */
  .czoom{ display:none }
  .ctools{ bottom:auto; top:calc(var(--headerH) + 2px); z-index:401 }
  .cclear{
    font-size:var(--t2); font-family:var(--font-t2); letter-spacing:var(--tr2);
    line-height:1.4; padding:4px 0; color:var(--ink);

@media (max-width:900px){ .ascii-fx, .ascii-gl, .ascii-st, .ascii-plate{ display:none } }

@media (max-width:900px){ footer, footer.revealed{ display:none } :root{ --holdall:1 } main.page.editorial{ position:relative; min-height:calc(var(--floor) - var(--inT,0px)) } main.page.editorial .stage{ position:absolute; top:calc(-1 * var(--inT,0px)); left:0; right:0; bottom:auto; height:var(--floor) } }

<script>
/* The Меню panel. Built from what the page's own header already carries: the
   button is the only thing added, and the rows it shows are the page's own
   elements, hidden by CSS and shown again — never cloned, so the listeners on
   the gender filter, the search link and the page's tools all survive.
   See _src/mobile.py. */
(function(){
  const hdr = document.querySelector('header');
  if(!hdr || hdr.querySelector('.mbtn')) return;
  const mq = matchMedia('(max-width:900px)');

  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'mbtn';
  btn.setAttribute('aria-expanded', 'false');
  /* the menu mark, assets/icons/menu.svg, inline so the page stays one file and
     the mark takes the ink colour; the word it replaced is its label */
  const MARK = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8.4 9.71" aria-hidden="true" focusable="false">'
    + '<path d="M8.4,3.24h-.02l-.76-1.04H.78L.02,3.24h-.02V0h.02l.72,1h6.91l.72-1h.02v3.24Z"/>'
    + '<path d="M8.4,6.48h-.02l-.76-1.04H.78L.02,6.48H0v-3.24h.02l.72,1h6.91l.72-1h.02v3.24Z"/>'
    + '<path d="M8.4,9.71h-.02l-.76-1.04H.78L.02,9.71H0v-3.24h.02l.72,1h6.91l.72-1h.02v3.24Z"/></svg>';
  /* the close mark: the lattice's cross — the page tile's two bowed strokes —
     turned 45°. The hidden full stop keeps the button a line of type tall. */
  const XMARK = '<span class="xhold" aria-hidden="true">.</span>'
    + '<svg class="xmark" xmlns="http://www.w3.org/2000/svg" viewBox="5.5 5.5 13 13" aria-hidden="true" focusable="false">'
    + '<g transform="rotate(45 12 12)" fill="none" stroke="currentColor" stroke-linecap="round">'
    + '<path d="M12 3.6C12.15 8.4 12.15 15.6 12 20.4"/><path d="M3.6 12C8.4 11.85 15.6 11.85 20.4 12"/></g></svg>';
  btn.innerHTML = MARK;
  btn.setAttribute('aria-label', 'Меню');
  hdr.insertBefore(btn, hdr.firstChild);

  /* A cart shortcut in the bar, on EVERY page (21 Sep, user's call: the bar of
     the shop — mark, wordmark, Корзина — is the bar of the site). Where the
     desktop header has a cart link the shortcut is read off it; the archive,
     the cart, the checkout and the editorial pages have none on the desktop,
     so theirs is made here, counting the cart page's own lines where there
     are any. */
  const src = hdr.querySelector('.right a[href*="cart"]');
  const a = document.createElement('a');
  a.className = 'mcart';
  if(src){
    a.href = src.getAttribute('href');
    a.textContent = src.textContent.trim();
    /* the bar now carries the cart, so the row it was copied from is marked
       and left out of the panel — the same control twice reads as two */
    (src.closest('.seg') || src).classList.add('mcart-src');
  } else {
    a.href = /\/final1\//.test(location.pathname) ? '../drafts/cart.html' : 'cart.html';
    /* the prototype's cart holds the two lines cart.html draws; the checkout
       is that same cart one step on, and it lists no lines of its own to count */
    const n = /checkout/.test(location.pathname) ? 2 : document.querySelectorAll('main .line').length;
    a.textContent = 'Корзина (' + n + ')';
  }
  hdr.appendChild(a);

  /* Search happens IN the panel (21 Sep, user's call): Поиск opened the shop's
     filter modal, a second sheet over this one. On a phone the Поиск box turns
     into the line itself. On the shop it drives the page's own search input
     (#q), so the grid, the count and «Сбросить фильтры» all follow as they do
     from the modal; on the pages whose Поиск is a link to the shop (product,
     archive piece, states) it carries the words there as `?q=`, which the
     shop reads below. The desktop is untouched: over 900px the link is let
     through to the page's own handler. */
  const slink = hdr.querySelector('.right a[href*="search"]');
  const pageQ = document.getElementById('q');
  let searchState = () => {};
  if(slink){
    const sseg = slink.closest('.seg') || slink;
    const form = document.createElement('form');
    form.className = 'msearch'; form.setAttribute('role', 'search');
    form.innerHTML = '<input type="search" placeholder="Найти" aria-label="Поиск"'
      + ' autocomplete="off" spellcheck="false" enterkeyhint="search">'
      + '<div class="msearch-foot"><span class="msearch-n" aria-live="polite"></span>'
      + '<button type="submit">Показать</button></div>';
    sseg.parentNode.insertBefore(form, sseg.nextSibling);
    const inp = form.querySelector('input'), cnt = form.querySelector('.msearch-n');
    const show = on => { form.classList.toggle('on', on); sseg.classList.toggle('msearch-src', on); };
    const count = () => {
      const c = document.getElementById('fcount');
      cnt.textContent = pageQ && c && inp.value.trim() ? c.textContent : '';
    };
    /* capture, and stopped here: the shop's own listener on the link would
       open the modal, and the panel's would close the panel */
    hdr.addEventListener('click', e => {
      if(!mq.matches || e.target.closest('a') !== slink) return;
      e.preventDefault(); e.stopPropagation();
      show(true); inp.focus();
    }, true);
    inp.addEventListener('input', () => {
      if(!pageQ) return;
      pageQ.value = inp.value; pageQ.dispatchEvent(new Event('input'));
      count();
    });
    form.addEventListener('submit', e => {
      e.preventDefault();
      const v = inp.value.trim();
      if(pageQ){ inp.blur(); open(false); scrollTo(0, 0); return; }
      if(!v) return;
      const u = new URL(slink.href); u.hash = ''; u.search = '';
      u.searchParams.set('q', v);
      location.href = u.href;
    });
    /* an empty line goes back to being the Поиск box when the panel closes; a
       line with words in it is still there, and still editable, on the next
       open — read back off the page's own input, which «Сбросить фильтры»
       in the filter modal may have emptied in the meantime */
    searchState = on => {
      if(on && pageQ && inp.value !== pageQ.value){ inp.value = pageQ.value; count(); }
      if(!inp.value.trim()) show(false);
    };
    const q0 = new URLSearchParams(location.search).get('q');
    if(pageQ && q0){
      inp.value = pageQ.value = q0; pageQ.dispatchEvent(new Event('input'));
      show(true); count();
    }
  }

  function open(on){
    hdr.classList.toggle('menu-open', on);
    document.documentElement.classList.toggle('menu-lock', on);
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
    if(on){ btn.innerHTML = XMARK; btn.setAttribute('aria-label', 'Закрыть'); }
    else { btn.innerHTML = MARK; btn.setAttribute('aria-label', 'Меню'); }
    searchState(on);
  }
  btn.addEventListener('click', () => open(!hdr.classList.contains('menu-open')));
  /* any link inside the panel closes it — a same-page anchor would otherwise
     leave it standing open. Поиск is the exception, stopped in capture above:
     it is used inside the panel */
  hdr.addEventListener('click', e => {
    if(e.target !== btn && e.target.closest('a')) open(false);
  });
  addEventListener('keydown', e => { if(e.key === 'Escape') open(false); });
  /* and on a rotation: the page's own reserve() re-measures the header on
     resize, and an open panel is 100svh tall — it would set --headerH, which
     positions everything, to the whole screen */
  /* — a rotation, not any resize: a phone's keyboard coming up for the search
     line resizes the window on some browsers, and changes only its height */
  let lastW = innerWidth;
  addEventListener('resize', () => {
    if(innerWidth === lastW) return;
    lastW = innerWidth;
    if(hdr.classList.contains('menu-open')) open(false);
  });

  /* The page's own head row lives inside the header on the desktop (the cart,
     the checkout and the text page put their h1 there). Behind the button it
     would be invisible, so on a phone it moves to the top of <main>. Moved,
     not copied: .phead carries buttons with listeners on them. */
  const slot = hdr.querySelector('.slot');
  const phead = hdr.querySelector('.phead');
  const main = document.querySelector('main');
  function place(){
    if(!phead || !main || !slot) return;
    if(mq.matches){ if(phead.parentNode !== main) main.insertBefore(phead, main.firstChild); }
    else if(phead.parentNode !== slot){ slot.appendChild(phead); }
  }
  /* The gender filter is not in the panel (21 Sep, user's call). On the shop it
     stands in the head row with Фильтр and Сортировать, set like them; on
     every other page that carries it — the product page — it is simply not
     shown on a phone. Moved, not copied, as above; and back again over 900px.
     The shop's own click handler clears aria-current through
     `header .slot .seg a`, which finds nothing once the row has left the
     header, so the clearing is repeated here on the row itself. */
  const gseg = hdr.querySelector('.slot .seg');
  const tools = document.querySelector('.gridhead .tools');
  function placeGender(){
    if(!gseg || !tools || !slot) return;
    if(mq.matches){ if(gseg.parentNode !== tools) tools.insertBefore(gseg, tools.firstChild); }
    else if(gseg.parentNode !== slot){ slot.appendChild(gseg); }
  }
  if(gseg && tools) gseg.addEventListener('click', e => {
    const hit = e.target.closest('a');
    if(!hit) return;
    gseg.querySelectorAll('a').forEach(x => { if(x !== hit) x.removeAttribute('aria-current'); });
  });
  function sync(){ if(!mq.matches) open(false); place(); placeGender(); }
  mq.addEventListener('change', sync);
  sync();

  /* the shop's filter modal, on the pages that have one */
  const pane = document.getElementById('pane');
  if(pane){
    const flag = () => document.documentElement.classList.toggle(
      'pane-modal', pane.classList.contains('modal-open'));
    new MutationObserver(flag).observe(pane, {attributes:true, attributeFilter:['class']});
    flag();
  }
})();
</script>
<script>
/* The fixed ASCII layer used to be lifted by however much of the footer was on
   screen, so a motif stood on the footer's rule. Since 22 Sep (the user) it is
   STILL: the footer — see-through, z-index 50 — scrolls up over the layer at
   5, and nothing here re-places a motif on scroll. Kept as a note; the
   desktop's own rules are untouched. See _src/mobile.py. */
</script>
<script>
/* The phone footer needs no script (22 Sep, the user). Until then a
   swipe-to-open handler put it into the layout on a swipe that started at the
   end of the page — a touch handler, a display toggle and a smooth scroll on
   every swipe, and every still page lagged under it. Now the footer is in the
   layout from the start, under a full-screen `main`, and the page simply
   scrolls into it and back. It is in _versions/2026-09-22-pre-phone-footer-flow/
   should it ever be wanted again. See _src/mobile.py. */
</script>

<script>
(function(){
  function hoist(){
    var fx=document.querySelector('body > .ascii-fx');
    if(fx && fx.previousElementSibling) document.body.prepend(fx);
  }
  hoist(); addEventListener('load', hoist);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(hoist);

  /* The crosses are FIXED again since later on 23 Sep (the user: still, on
     every page) — the box no longer follows the document's height. fit()
     only clears the min-height an earlier build may have left inline. */
  var mq=matchMedia('(max-width:900px)'), lat=document.querySelector('body > .lattice');
  function fit(){
    if(!lat) return;
    lat.style.minHeight='';
  }
  fit(); addEventListener('load', fit); addEventListener('resize', fit); setTimeout(fit, 1200);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if(window.ResizeObserver) new ResizeObserver(fit).observe(document.body);

  /* the two tint chips Safari 26 reads its chrome's colour from (THE CHROME'S
     COLOUR in _src/mobile.py): fixed, full width, 4px, at the very top and the
     very bottom; the CSS shows them only under the landing and the Меню panel */
  if(!document.querySelector('.tint-t')){
    ['tint-t','tint-b'].forEach(function(c){
      var d=document.createElement('div'); d.className='tint '+c; d.setAttribute('aria-hidden','true');
      document.body.prepend(d);
    });
  }

  /* The landing layer is absolute at the document's top on a phone (THE
     FLOOR). When the logo brings it down over a page scrolled away from its
     top, the merge slides the layer in with a transform and only then puts
     the page back to its top — so for that slide the layer is pinned fixed
     (inset:0; cut on the bar, for a second) and let go at scrollY 0, where
     fixed and absolute coincide. Never while the merge holds its own inline
     position (the travel at the top of the page writes cssText). */
  /* THE RUNWAY AND THE BLEED (see the CSS): iOS only — the strips Safari 26
     keeps above and below its window. --inT from the iPhone table, --inB
     measured: the screen's height minus the small viewport minus --inT. */
  var rt=document.documentElement, T=0;
  var ios=(window.CSS && CSS.supports('-webkit-touch-callout','none')) || /[?&]runway/.test(location.search);
  var holdall=!!getComputedStyle(rt).getPropertyValue('--holdall').trim();   /* a page that never scrolls (publications) */
  /* THE HOME SCREEN (see _src/mobile.py): in iOS's standalone web-app shell
     there is no strip to dodge, so nothing is held off the top. --inT and
     --inB are 0 (everything keyed to them — the runway box, main's min-height,
     the publications stage, the landing merge's T0() — then sits flush at the
     document's top) and --floor is the window, which IS the screen.
     navigator.standalone is false in Safari and undefined in every other
     browser, so this branch is the Home Screen's alone. */
  var standalone = (navigator.standalone === true);
  if(mq.matches && standalone){
    rt.style.setProperty('--inT','0px'); rt.style.setProperty('--inB','0px');
    var floor=function(){ rt.style.setProperty('--floor', innerHeight+'px'); };
    floor(); addEventListener('load', floor); addEventListener('resize', floor);
    fit();
  } else if(mq.matches && ios){
    var W=Math.min(screen.width,screen.height), H=Math.max(screen.width,screen.height);
    var TOP={'402x874':62,'440x956':62,'420x912':62,'393x852':59,'430x932':59,
             '390x844':47,'428x926':47,'375x812':44,'414x896':44,
             '375x667':20,'414x736':20,'320x568':20};
    T=TOP[W+'x'+H]; if(T==null) T=H>=874?62:H>=852?59:H>=812?47:20;
    var m=document.createElement('div'); m.style.cssText='position:absolute;visibility:hidden;height:100svh;pointer-events:none';
    document.body.appendChild(m); var S=m.getBoundingClientRect().height; m.remove();
    if(!S || S>H) S=innerHeight;
    var B=Math.max(0, Math.round(H-S-T));
    rt.style.setProperty('--inT',T+'px'); rt.style.setProperty('--inB',B+'px');
    /* and the floor itself, in px (23 Sep, the user's phone): the CSS re-derives
       it from 100svh, and on iOS a box sized by it was seen NOT to grow after
       --inT/--inB were set — the publications canvas stayed laid out for the
       pre-runway height. The screen's height is the floor, stated outright. */
    rt.style.setProperty('--floor', H+'px');
    /* AND the publications stage outright, in px (23 Sep, the user: on the
       phone the canvas still would not fill the screen). Its height came from
       `var(--floor)`, itself `max(100lvh, calc(var(--inT) + 100svh + var(--inB)))`
       — a chain iOS did not re-resolve when the vars were set here, so the box
       stayed at its pre-runway height and the canvas laid its field out for
       that. Two inline px values instead: nothing left to invalidate, and the
       canvas's ResizeObserver sees a real box change and re-lays out. */
    /* The stage is ordinary page content (position:absolute), the whole screen
       tall, starting --inT above the window. That is the ONLY thing iOS draws
       into the two strips: a position:fixed layer is cut at the window's edges
       whatever its bleed — which is why the crosses, fixed since 23 Sep, do
       not reach them either (the user, confirming it on the phone). So the
       photographs have to BE there, in the document's first --inT pixels and
       its last --inB, which is what the field's footprint below arranges. */
    var st=document.querySelector('main.page.editorial .stage');
    if(st){ st.style.top=(-T)+'px'; st.style.height=H+'px'; }
    if(!document.querySelector('body > .runway')){
      var r=document.createElement('div'); r.className='runway'; r.setAttribute('aria-hidden','true');
      document.body.prepend(r);
    }
    fit();
    /* Start past the runway and HOLD there (23 Sep, the user: a pull down on
       a page that fits the screen moved the whole page and rubber-banded it
       back). A pull down that starts at rest is swallowed — the page could
       only reveal the runway — and a scroll that overshoots the runway
       without a finger on the glass (momentum, a tap on the status bar) is
       put back on it at once. Never under the landing (the merge owns the
       gestures there), the Меню panel or the shop's filter pane, and never
       for a scrollable box of the page's own. A drag that begins further
       down and runs past the runway is a committed native scroll that no
       preventDefault can stop; it is put back on the runway when the finger
       lifts. */
    var touching=false, y0=0;
    function locked(){ return rt.classList.contains('landing-on')||rt.classList.contains('menu-lock')||rt.classList.contains('pane-modal'); }
    function ownScroller(el){
      for(; el && el!==document.body; el=el.parentElement){
        var o=getComputedStyle(el).overflowY;
        if((o==='auto'||o==='scroll') && el.scrollHeight>el.clientHeight+1) return true;
      }
      return false;
    }
    function hold(){ if(!touching && !locked() && (window.scrollY<T-0.5 || (holdall && window.scrollY>T+0.5))) window.scrollTo(0,T); }
    addEventListener('touchstart', function(e){ touching=true; y0=e.touches[0].clientY; }, {passive:true});
    addEventListener('touchmove', function(e){
      if(locked() || e.touches.length!==1 || !e.cancelable || ownScroller(e.target)) return;
      if(holdall || (window.scrollY<=T+0.5 && e.touches[0].clientY>y0)) e.preventDefault();
    }, {passive:false});
    function up(){ touching=false; hold(); }
    addEventListener('touchend', up, {passive:true}); addEventListener('touchcancel', up, {passive:true});
    addEventListener('scroll', hold, {passive:true});
    if(window.scrollY<T) window.scrollTo(0,T);
  }

  var layer=document.getElementById('landing');
  if(layer){
    var pinned=false;
    function pin(){
      if(!mq.matches || layer.style.position) return;
      layer.style.position='fixed'; layer.style.inset='0'; layer.style.height='auto'; pinned=true;
    }
    function unpin(){
      if(!pinned) return;
      pinned=false;
      layer.style.removeProperty('position'); layer.style.removeProperty('inset'); layer.style.removeProperty('height');
    }
    new MutationObserver(function(){
      if(rt.classList.contains('landing-on')){ if(window.scrollY>T+1) pin(); }
      else unpin();
    }).observe(rt,{attributes:true, attributeFilter:['class']});
    addEventListener('scroll', function(){ if(pinned && window.scrollY<=T+1) unpin(); }, {passive:true});
  }
})();
</script>

<script>
/* THE CROSSES (and the hearts) ARE STILL — 23 Sep, the user: "everything disrupts
   them". Every page's own alignLattice() centres the tile's phase on the WINDOW
   (innerWidth/innerHeight) and re-runs on every resize, and on a phone the window
   resizes all the time: Safari's bar collapses and grows with every scroll, the
   keyboard comes up, the address bar minimises — and each time the phase jumped by
   half the change in height. On a phone the phase is pinned to the SCREEN instead
   (its width, and on iOS its full height — the floor; elsewhere the height seen
   first), constant for the device, rotation aside. An !important rule beats the
   inline values the page keeps writing, and lattice_vector.py's place() reads the
   computed value, so the vector tile follows. The landing's hero shift — its nav
   letters sit centred in a gutter — is re-derived against the pinned phase, from
   the page's own result (it runs after the page's handler on the same events). */
(function(){
  var mq=matchMedia('(max-width:900px)'), CELL=60, st=null, W=0, Y=0;
  var ios=(window.CSS && CSS.supports('-webkit-touch-callout','none')) || /[?&]runway/.test(location.search);
  function ph(v){ return ((v-CELL)/2)%CELL; }
  function pin(){
    if(!mq.matches){ if(st){ st.remove(); st=null; W=0; } return; }
    var w=innerWidth; if(st && w===W) return; W=w;
    var H=ios ? Math.max(screen.width,screen.height) : innerHeight;
    Y=ph(H);                                          /* the phase wanted on the SCREEN */
    if(!st){ st=document.createElement('style'); st.id='latstill'; document.head.appendChild(st); }
    st.textContent=':root{--lat-x:'+ph(w).toFixed(3)+'px !important; --lat-y:'+Y.toFixed(3)+'px !important}';
  }
  var hero=document.getElementById('hero');
  function shift(){
    if(!mq.matches || !hero || !st) return;
    var s=parseFloat(hero.style.getPropertyValue('--shift'))||0;
    var d=s + ph(innerHeight) - Y;                    /* the page's shift, moved to the pinned phase */
    d=((d%CELL)+CELL)%CELL; if(d>CELL/2) d-=CELL;
    hero.style.setProperty('--shift', d.toFixed(3)+'px');
  }
  function run(){ pin(); shift(); }
  run(); addEventListener('resize', run); addEventListener('load', run);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(run);
})();
</script>

<script>
/* Safari 26 colours its status bar and the space round its address bar from
   <meta name="theme-color">: black while the landing or the Меню panel covers
   the page, the paper otherwise. See _src/mobile.py. */
(function(){
  const rt = document.documentElement;
  let meta = document.querySelector('meta[name="theme-color"]');
  if(!meta){ meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.appendChild(meta); }
  function paint(){
    const dark = rt.classList.contains('landing-on') || rt.classList.contains('menu-lock');
    const c = dark ? '#000000' : (getComputedStyle(document.body).backgroundColor || '#FFFFFF');
    if(meta.content !== c) meta.content = c;
  }
  new MutationObserver(paint).observe(rt, {attributes:true, attributeFilter:['class']});
  addEventListener('load', paint);
  paint();
})();
</script>

<!-- ---------- probe:bars — TEMPORARY (24 Sep). Runs ONLY on ?probe. ----------
     Settles why the photographs stop dead on Safari's window edges while the
     same geometry in Chrome bleeds past them. Three test bands in the top and
     bottom strips, one per kind of box, left to right:
       PINK   position:absolute child of <html>  — ordinary document content
       CYAN   position:fixed, bled past the window — known to be cut by iOS
       ORANGE position:absolute inside .stage    — where the photographs are
     Whichever colours show under the island and around the address bar are the
     boxes iOS will actually paint there on THIS page. Delete when settled. -->
<script>
(function(){
  if(!/[?&]probe/.test(location.search)) return;
  var rt=document.documentElement, body=document.body;
  var css=function(n){ return parseFloat(getComputedStyle(rt).getPropertyValue(n))||0; };
  function band(parent,style,tag,bg){
    var d=document.createElement('div');
    d.setAttribute('data-probe',tag);
    d.style.cssText='pointer-events:none;z-index:2147483000;opacity:.85;'+style+';background:'+bg;
    parent.appendChild(d); return d;
  }
  function vu(unit){                       /* measure 100svh / 100lvh / 100dvh */
    var m=document.createElement('div');
    m.style.cssText='position:absolute;visibility:hidden;pointer-events:none;height:100'+unit;
    body.appendChild(m); var h=m.getBoundingClientRect().height; m.remove();
    return Math.round(h);
  }
  function clippers(el){                   /* ancestors that could cut the stage */
    var out=[];
    for(var n=el; n && n!==rt; n=n.parentElement){
      var s=getComputedStyle(n), why=[];
      if(s.overflow!=='visible') why.push('ov:'+s.overflow);
      if(s.transform!=='none') why.push('tf');
      if(s.filter!=='none') why.push('fi');
      if(s.contain&&s.contain!=='none') why.push('ct');
      if(why.length) out.push((n.tagName+'.'+(n.className||'')).slice(0,22)+'['+why.join(',')+']');
    }
    return out.join(' ') || 'none';
  }
  /* ?noviz — the canvas taken out entirely (the user's hypothesis: the
     publications images are what stops iOS painting the strips). The stage is
     display:none, so the whole transformed field, its compositing layers and
     its 167 images are gone; the runway, the header and the test bands stay.
     The body also goes a strong green: if the strips turn GREEN the chrome is
     merely SAMPLING the page's colour (the theme-color path), whereas if the
     pink/orange BANDS appear the page is really painting there. */
  var noviz=/[?&]noviz/.test(location.search);
  function draw(){
    [].forEach.call(document.querySelectorAll('[data-probe]'),function(e){ e.remove(); });
    var T=css('--inT'), B=css('--inB'), F=css('--floor');
    var st=document.querySelector('main.page.editorial .stage');
    if(noviz && st){ st.style.display='none'; body.style.background='#00AA44'; rt.style.background='#00AA44'; }
    var W=innerWidth, t=Math.round(W/3);
    band(rt,'position:absolute;left:0;top:0;width:'+t+'px;height:'+T+'px','A-top','#FF00AA');
    band(rt,'position:absolute;left:0;top:'+(F-B)+'px;width:'+t+'px;height:'+B+'px','A-bot','#FF00AA');
    band(body,'position:fixed;left:'+t+'px;top:'+(-T)+'px;width:'+t+'px;height:'+T+'px','F-top','#00CFFF');
    band(body,'position:fixed;left:'+t+'px;bottom:'+(-B)+'px;width:'+t+'px;height:'+B+'px','F-bot','#00CFFF');
    /* the third band goes wherever the photographs would be: inside the stage
       normally, and — with the stage switched off — inside `main`, which sits
       --inT down the document, so the same two document rows are covered */
    var sr=st?st.getBoundingClientRect():null;
    var host=noviz? document.querySelector('main.page.editorial') : st, hTop, hBot;
    if(noviz && host){ hTop=-T; hBot=F-B-T; }
    else if(st){ hTop=0; hBot=sr.height-B; }
    if(host && hTop!=null){
      band(host,'position:absolute;left:'+(2*t)+'px;top:'+hTop+'px;width:'+t+'px;height:'+T+'px','S-top','#FF8A00');
      band(host,'position:absolute;left:'+(2*t)+'px;top:'+hBot+'px;width:'+t+'px;height:'+B+'px','S-bot','#FF8A00');
    }
    var rs=[].map.call(document.querySelectorAll('.card'),function(c){ return c.getBoundingClientRect(); })
             .filter(function(r){ return r.width>0; });
    var fld=rs.length? '['+Math.round(Math.min.apply(null,rs.map(function(r){return r.top+scrollY;})))+','+
                            Math.round(Math.max.apply(null,rs.map(function(r){return r.bottom+scrollY;})))+']' : 'none';
    var L=[
      'screen '+screen.width+'x'+screen.height+'  win '+innerWidth+'x'+innerHeight,
      'svh '+vu('svh')+'  lvh '+vu('lvh')+'  dvh '+vu('dvh')+'  vv '+(window.visualViewport?Math.round(visualViewport.height):'-'),
      'inT '+T+'  inB '+B+'  floor '+F,
      'scrollY '+Math.round(scrollY)+'  docH '+rt.scrollHeight+'  holdall '+(css('--holdall')||getComputedStyle(rt).getPropertyValue('--holdall').trim()||'0'),
      st? 'stage '+getComputedStyle(st).position+'  doc['+Math.round(sr.top+scrollY)+','+Math.round(sr.bottom+scrollY)+']  h'+Math.round(sr.height)
        : 'stage NOT FOUND',
      st? 'stage.parent '+(st.offsetParent?st.offsetParent.tagName+'.'+String(st.offsetParent.className).slice(0,14):'null') : '',
      'cards '+rs.length+'  field doc'+fld,
      'clip '+(st?clippers(st.parentElement):'-'),
      'standalone '+(navigator.standalone===true?'1':'0')+'  runwayRan '+(T?'1':'0')+'  noviz '+(noviz?'1':'0')
    ].join('\n');
    var o=band(body,'position:fixed;left:8px;right:8px;top:50%;transform:translateY(-50%);opacity:1;'+
      'white-space:pre;font:10px/1.45 ui-monospace,Menlo,monospace;color:#000;padding:8px;'+
      'border:1px solid #000;letter-spacing:0','readout','#FFFF66');
    o.textContent=L;
  }
  addEventListener('load',function(){ setTimeout(draw,900); setTimeout(draw,3000); });
  addEventListener('resize',function(){ setTimeout(draw,400); });
})();
</script>
<!-- ---------- /probe:bars ---------- -->
