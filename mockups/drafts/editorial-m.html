   so the left edge is ragged. Positions are computed in world units for the

     SCREEN, at the screen's own size and aspect — full width, from the first
     row of pixels the window shows (winTop() = --inT, the runway's height) to
     the stage's bottom edge, so the field runs up behind the transparent
     header and the logo and down behind Safari's address bar the way the rest
     of the page does. The header gets no exclusion; the category column below
     still slides cards clear of itself, which is what keeps it readable. */

     and vh its last, under the address bar. It used to start at winTop(), the
     window's top edge, which left the strip above it outside the field: the
     photographs stopped where Safari's window did and the strip showed the
     bare paper behind them ("white bars", the user, 23 Sep). */

      bottom=phone?vh:vh-(cssPx('--gapBottom')||19);

     the footprint above ends the first row's centres ON the screen's top pixel

     below its window showed the stage's bare paper. Half a row of bleed at each
     end instead: row 1 straddles the top edge, row R the bottom, and the

     ladder is simply half a row taller at both ends. */

  for(let r=0; diff!==0; r=(r+1)%R){ counts[r]+=Math.sign(diff); diff-=Math.sign(diff); }

     so measure the real extent of the boxes and map it exactly onto the same
     footprint (XL/XR/top/bottom above: the desktop's box, or the phone's

function ring(i, e, t){

  to(pan,{x:0,y:0},{duration:1,ease:'expo.inOut',onComplete:()=>{ pan.tx=0; pan.ty=0; pan.locked=false; }});
  const z={p:zoom.target};
  to(z,{p:zoom.floor},{duration:1,ease:'expo.inOut',onUpdate:()=>{ zoom.target=z.p; slider.value=z.p; }});
  cards.forEach(c=>to(c.X.cur,{x:0,y:0},{duration:1,ease:'expo.inOut'}));
}

/* ---- zoom: wheel, pinch, slider ---- */
stage.addEventListener('wheel',e=>{
  e.preventDefault(); e.stopPropagation();                 // the footer reveal must not fire here
  if(transitioning) return;
  const o=off(); anchor.x=e.clientX+o.x; anchor.y=e.clientY+o.y;
  zoom.target=clamp(zoom.floor,zoom.max,zoom.target-e.deltaY/750);
  slider.value=zoom.target;
},{passive:false});
let pinchD=0;
stage.addEventListener('touchstart',e=>{ if(e.touches.length===2) pinchD=Math.hypot(e.touches[0].pageX-e.touches[1].pageX,e.touches[0].pageY-e.touches[1].pageY); },{passive:true});
stage.addEventListener('touchmove',e=>{
  if(transitioning||e.touches.length!==2) return;
  const d=Math.hypot(e.touches[0].pageX-e.touches[1].pageX,e.touches[0].pageY-e.touches[1].pageY);
  const o=off(); anchor.x=(e.touches[0].clientX+e.touches[1].clientX)/2+o.x; anchor.y=(e.touches[0].clientY+e.touches[1].clientY)/2+o.y;
  zoom.target=clamp(zoom.floor,zoom.max,zoom.target+(d-pinchD)/750); pinchD=d; slider.value=zoom.target;
},{passive:true});
slider.addEventListener('input',()=>{ sliderActive=true; anchorCentre(); zoom.target=parseFloat(slider.value); });
slider.addEventListener('change',()=>{ sliderActive=false; });
slider.addEventListener('pointerup',()=>{ sliderActive=false; });

/* ---- camera moves on every view change (their U1: h() then f()) ---- */
function cameraFor(v){
  transitioning=true; stage.classList.add('locked'); anchorCentre();
  const z={p:zoom.target};
  killTweensOf(z);
  to(z,{p:v==='default'?zoom.floor:zoom.base},{duration:.75,ease:'expo.inOut',
    onUpdate:()=>{ zoom.target=z.p; slider.value=z.p; },
    onComplete:()=>{
      if(v==='node'){
        to(z,{p:nodeZoom},{duration:.75,delay:.25,ease:'expo.inOut',
          onUpdate:()=>{ zoom.target=z.p; slider.value=z.p; },
          onComplete:()=>{ transitioning=false; stage.classList.remove('locked'); }});
      } else { transitioning=false; stage.classList.remove('locked'); }
    }});
  /* and the field itself glides back to the origin (their P()) */
  pan.locked=true;
  const grp=v==='filter'||v==='node';
  const hx=grp?camHome.x:0, hy=grp?camHome.y:0;   // camHome: see showGrid and selectNode
  to(pan,{x:hx,y:hy},{duration:1,ease:'expo.inOut',onComplete:()=>{ pan.tx=hx; pan.ty=hy; pan.locked=false; }});
}

/* ---- active / dim (their Xe) ---- */
function setActive(c,on){
  if(c.active===on && introDone) return;
  c.active=on; c.el.classList.toggle('inactive',!on);
  if(on){ c.z=c.zSaved||c.z; c.el.style.zIndex=c.z; to(c.vl,{v:0},{duration:1,ease:'power2.out'}); to(c.dm,{v:0},{duration:.75,ease:'expo.inOut'}); }
  else { c.zSaved=c.z; c.el.style.zIndex=-(DATA.length-c.i); c.vl.v=.9; killTweensOf(c.vl); to(c.dm,{v:1},{duration:.75,ease:'expo.inOut'}); }
  if(hovered===c&&!on) setHover(null);
}

/* ---- the view switch every card answers to (their Je + ve) ---- */
function applyView(v){
  prevView=view; view=v;
  cards.forEach(c=>{
    const arranged=c.view!=='default';
    to(c.ee,{f:v==='default'?1:0},{duration:1,ease:'expo.inOut'});
    let dur=1;
    if(prevView&&prevView!=='default'&&v!=='default'&&!c.active) dur=0;
    const full=(v==='filter'&&c.filterActive)||c.expanded;
    to(c.sc,{v:full?1:c.SCALE},{duration:dur,ease:'expo.inOut'});
    if(arranged){
      to(c.T,{x:-(c.base.x+c.X.cur.x),y:-(c.base.y+c.X.cur.y)},{duration:dur,ease:'expo.inOut'});
      to(c.U,{x:c.offset.x,y:c.offset.y},{duration:dur,ease:'expo.inOut'});
    } else {
      to(c.T,{x:0,y:0},{duration:dur,ease:'expo.inOut'});
      to(c.U,{x:0,y:0},{duration:dur,ease:'expo.inOut'});
    }
    c.el.classList.toggle('expanded',c.expanded);
    c.el.classList.toggle('grouped',v==='filter'&&c.filterActive);   // data shows only when grouped
  });
  cameraFor(v);
  openBox.classList.toggle('on', v==='node');
  if(hovered) hoverFx(hovered,true);
}

/* ---- node view: the click ---- */
let nodeZoom=.4+.75;
/* the screen the node block may use, in CSS px: clear of the category column
   on both sides (so the block stays centred), of the header and of the data
   line at the bottom */
function nodeRoom(){
  const cats=filterBox.getBoundingClientRect(), side=cats.width?cats.right+24:24;
  /* the header and the data line sit in the WINDOW (fixed), so the room is
     measured from the window's edges, wherever the stage's own edges are */
  const top=winTop()+(cssPx('--headerH')||66)+(cssPx('--gap')||24), bottom=winBot()+(cssPx('--gapBottom')||19)+50;
  return {w:Math.max(200,vw-2*side), h:Math.max(200,vh-top-bottom)};
}
function pick(pool, pred, n){ return pool.filter(pred).slice(0,n); }
function tag(c,k){ const t=c.tags.find(t=>t[0]===k); return t?t[1]:''; }
function selectNode(c,level='shoot'){
  focus=null;
  selected=c; flip=Math.random();
  /* OURS (22 Sep, the user's call): only their horizontal rows — no children
     row on the far side. The clicked card stands at the left, its whole shoot
     GROUP (every photograph and film of the shoot, plus the one-file shoots
     paired with it in _src/publikacije.py) runs to the right in shoot order,
     in rows that zig-zag by G/2 exactly as their siblings / acquaintances
     rows do, each row chained card to card from the clicked one. Two rows as
     theirs; one for a group of three or fewer, up to four when that lets the
     camera come closer. The camera frames the block, never nearer than theirs. */
  /* Two levels where the user has picked SUBGROUPS inside a shoot
     (inbox/publikacije_2026-09-22/subgroups.json, picked on podgrupe.html):
     level 'shoot' gathers the whole group with one chained row per subgroup
     (frames in no subgroup share the rows after them); a click on a card of a
     subgroup then narrows to level 'sub', that subgroup alone in the rows
     above. A shoot with no subgroups has the one level. Since the column
     levels (22 Sep) a card of a subgroup comes here from its shoot's grid
     straight at level 'sub'. */
  const bySeq=(a,b)=>a.d.seq-b.d.seq;
  const members=cards.filter(o=>o!==c&&(level==='sub'?o.d.sg===c.d.sg:o.d.g===c.d.g)&&passes(o,typeSel())).sort(bySeq);
  const n=members.length, room=nodeRoom();
  const box=(pos,rows)=>{
    const all=[...pos].map(([o,q])=>({o,q}));
    const L=Math.min(...all.map(e=>e.q.x-90)), Rr=Math.max(...all.map(e=>e.q.x+90));
    const T=Math.min(...all.map(e=>e.q.y-e.o.H/2)), B=Math.max(...all.map(e=>e.q.y+e.o.H/2+81));
    return {rows, pos, L, Rr, T, B, fit:Math.min(room.w/(Rr-L),room.h/(B-T))};
  };
  const lay2=(rows)=>{                       // their zig-zag, for one or two rows
    const pos=new Map([[c,{x:0,y:0}]]), R=rows.length;
    rows.forEach((row,k)=>row.forEach((o,w)=>{
      const x=(k%2?1.2*G:G)+G*w;
      let Q=R===1?0:G/2-k*G; if(w%2) Q+=G/2;
      pos.set(o,{x,y:-Q});                   // their y is up
    }));
    return box(pos,rows);
  };
  const layN=(rows)=>{                       // three rows or more: stacked, a light zig-zag
    const pos=new Map([[c,{x:0,y:0}]]), R=rows.length;
    const PY=Math.max(...[c,...members].map(o=>o.H))+81+70;
    rows.forEach((row,k)=>row.forEach((o,w)=>{
      pos.set(o,{x:(k%2?1.2*G:G)+G*w, y:(k-(R-1)/2)*PY+(w%2?PY*.1:0)});
    }));
    return box(pos,rows);
  };
  const place=(rows)=>rows.length<=2?lay2(rows):layN(rows);
  const split=(list,R)=>{ const per=Math.ceil(list.length/R); return Array.from({length:R},(_,k)=>list.slice(k*per,(k+1)*per)).filter(r=>r.length); };
  let lay;
  const subs=level==='shoot'?[...new Set(members.concat(c).map(o=>o.d.sg).filter(Boolean))]:[];
  if(subs.length){
    /* the clicked card's own subgroup first, then the others in shoot order */
    subs.sort((a,b)=>(a===c.d.sg?-1:b===c.d.sg?1:0)||
      Math.min(...members.filter(o=>o.d.sg===a).map(o=>o.d.seq))-Math.min(...members.filter(o=>o.d.sg===b).map(o=>o.d.seq)));
    const rows=subs.map(s=>members.filter(o=>o.d.sg===s)).filter(r=>r.length);
    const rest=members.filter(o=>!o.d.sg);
    const longest=Math.max(1,...rows.map(r=>r.length));
    if(rest.length) rows.push(...split(rest,Math.ceil(rest.length/Math.max(longest,4))));
    lay=place(rows);
  } else {
    lay=place(split(members,n<=3?1:2));
    if(n>3) for(let R=3;R<=4;R++){ const l=place(split(members,R)); if(l.fit>lay.fit*1.08) lay=l; }
  }
  cards.forEach(o=>{ o.expanded=false; o.filterActive=false; o.view='default'; o.offset={x:0,y:0};
                     o.rows.forEach(r=>r.classList.remove('linked')); });
  lay.pos.forEach((q,o)=>{ o.offset={x:q.x,y:q.y}; o.expanded=true; o.view='node'; });
  cards.forEach(o=>setActive(o,o.expanded));
  nodeZoom=clamp(zoom.base,zoom.base+.75,lay.fit);
  camHome.x=-(lay.L+lay.Rr)/2; camHome.y=-(lay.T+lay.B)/2;
  /* connectors: selected→first→second… along each row, from tag row to tag
     row (row k of the block leaves from tag row k, as theirs) */
  links=[];
  lay.rows.forEach((row,k)=>{
    const chain=[c,...row];
    for(let q=0;q<chain.length-1;q++){
      const tr=k%3;                          // the tag row the chain leaves from (Съёмка / Тип / Сезон)
      links.push({a:chain[q], b:chain[q+1], mode:'lr', type:'row', active:false, isSingle:row.length<=1, row:tr, op:{v:0},
                  r1:.55+Math.random()*.95, r2:.55+Math.random()*.95});   // crosses differ in size
      if(LINK_STYLE==='curve'){ chain[q].rows[tr].classList.add('linked'); chain[q+1].rows[tr].classList.add('linked'); }
    }
  });
  drawLinks(true);
  links.forEach(l=>to(l.op,{v:1},{duration:.5,delay:1.5,ease:'power2.out'}));
  showData(c);
  applyView('node');
}
/* connector style: 'curve' (theirs, from tag row to tag row) or 'cross' (the
   user's option, kept for later). Either way they run over the dimmed cards
   and under the grouped ones. */
const LINK_STYLE='curve';
function drawLinks(rebuild){
  if(rebuild){ svg.innerHTML=''; links.forEach(l=>{ l.el=document.createElementNS('http://www.w3.org/2000/svg','path'); svg.appendChild(l.el); }); }
  links.forEach(l=>{
    const a=l.a, b=l.b, sa=a.U.s*a.sc.v, sb=b.U.s*b.sc.v;
    if(LINK_STYLE==='curve'){
      /* theirs: a bezier from a tag row of one card to a tag row of the next,
         horizontal handles at the midpoint */
      let V=8+l.row*12, K=8+l.row*12;
      if(l.active){ if(l.type==='children') V=8; if(l.type==='siblings') V=20; if(l.type==='acquaintances'&&!l.isSingle) V=32; }
      const ax=a.pos.x+(l.mode==='lr'?a.W/2:-a.W/2)*sa, ay=a.pos.y+(a.H/2+V)*sa;
      const bx=b.pos.x+(l.mode==='lr'?-b.W/2:b.W/2)*sb, by=b.pos.y+(b.H/2+K)*sb;
      const mx=ax+(bx-ax)/2;
      l.el.setAttribute('d',`M${ax.toFixed(1)},${ay.toFixed(1)} C${mx.toFixed(1)},${ay.toFixed(1)} ${mx.toFixed(1)},${by.toFixed(1)} ${bx.toFixed(1)},${by.toFixed(1)}`);
      l.el.style.opacity=l.op.v.toFixed(3);
      return;
    }
    /* the cross option (16 Sep, the user's reference): one big cross per
       connection at the midpoint between the two cards; one arm spans the gap
       between their facing edges, the other crosses it and runs about the
       gap's length each side, each half scaled by its own random factor so
       no two crosses match. Same 1px grey stroke. */
    const A={x:a.pos.x, y:a.pos.y, hw:a.W/2*sa, hh:a.H/2*sa}, B={x:b.pos.x, y:b.pos.y, hw:b.W/2*sb, hh:b.H/2*sb};
    const dx=B.x-A.x, dy=B.y-A.y, mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
    const f=n=>n.toFixed(1);
    let d;
    if(Math.abs(dx)>=Math.abs(dy)){                       // side by side: horizontal arm bridges the gap
      const x1=dx>0?A.x+A.hw:A.x-A.hw, x2=dx>0?B.x-B.hw:B.x+B.hw;
      const arm=Math.max(Math.abs(x2-x1),100);
      d=`M${f(x1)},${f(my)} L${f(x2)},${f(my)} M${f(mx)},${f(my-arm*l.r1)} L${f(mx)},${f(my+arm*l.r2)}`;
    } else {                                              // stacked: vertical arm bridges the gap
      const y1=dy>0?A.y+A.hh:A.y-A.hh, y2=dy>0?B.y-B.hh:B.y+B.hh;
      const arm=Math.max(Math.abs(y2-y1),100);
      d=`M${f(mx)},${f(y1)} L${f(mx)},${f(y2)} M${f(mx-arm*l.r1)},${f(my)} L${f(mx+arm*l.r2)},${f(my)}`;
    }
    l.el.setAttribute('d',d);
    l.el.style.opacity=l.op.v.toFixed(3);
  });
}

/* ---- the column: what is pressed gathers into a grid (their T()) ----
   OURS (22 Sep): see `sel` and `drill`. A drilled shoot's grid is that whole
   shoot, still narrowed by Фото / Видео; so are the rows (selectNode). */
function inGrid(c,g){
  if(g.k==='Сезон') return tag(c,'Сезон')===g.v;
  if(g.k==='Тип') return (g.v==='Видео')===!!c.d.video;
  return c.d.g===g.v;
}
function passes(c,list){
  const by={}; list.forEach(f=>(by[f.k]=by[f.k]||[]).push(f.v));
  return Object.entries(by).every(([k,vs])=>vs.some(v=>inGrid(c,{k,v})));
}
const typeSel=()=>sel.filter(f=>f.k==='Тип');
function gridList(){ return drill?typeSel().concat({k:'Съёмка',v:drill}):sel; }
function syncFilterButtons(){
  const on=gridList().concat(sel);     // a drilled shoot shows pressed too
  filterBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', on.some(f=>f.k===b.dataset.k&&f.v===b.dataset.v)?'true':'false'));
}
function columnClick(k,v){
  const idx=sel.findIndex(f=>f.k===k&&f.v===v);
  if(idx>-1) sel.splice(idx,1); else sel.push({k,v});
  drill=null;
  if(!sel.length){ reset(); return; }
  showGrid();
}
function showGrid(){
  const g=gridList();
  focus=null; selected=null; links=[]; svg.innerHTML=''; openBox.classList.remove('on');
  syncFilterButtons();
  cards.forEach(o=>{ o.expanded=false; o.view='default'; o.offset={x:0,y:0}; o.rows.forEach(r=>r.classList.remove('linked')); });
  const hit=cards.filter(o=>{ o.filterActive=passes(o,g); return o.filterActive; });
  let j=Math.round(Math.sqrt(hit.length)); const L=350;
  /* OURS, phones only: sub.global keeps the same grid at every width and lets
     it run off the screen, but its filters are four lines under the header —
     ours are a column down the left edge, and the grid slid under it. So the
     grid takes as many columns as fit beside the column, and the camera frames
     it there: centred in the free width, first row under the header when the
     grid is taller than the screen (it is then panned like a list). */
  camHome.x=0; camHome.y=0;
  let rc=j;                     // theirs centres the rows on the column count: the grid is square
  if(vw<768){
    const z=zoom.base, left=filterBox.getBoundingClientRect().right+4, free=vw-left-6;
    j=clamp(1,j,Math.floor((free-180*z)/(L*z))+1);
    const rows=rc=Math.ceil(hit.length/j), top=winTop()+(cssPx('--headerH')||48)+70;
    camHome.x=((left+vw-6)/2-vw/2)/z;
    camHome.y=Math.max(0,(top-vh/2)/z+(rows-1)/2*L);
  }
  /* OURS (22 Sep): theirs shuffles the grid; here each shoot group stays
     together, groups in field order, a group's own frames in shoot order */
  const gFirst={}; cards.forEach(o=>{ if(!(o.d.g in gFirst)) gFirst[o.d.g]=o.i; });
  hit.sort((a,b)=>gFirst[a.d.g]-gFirst[b.d.g]||a.d.seq-b.d.seq);
  hit.forEach((o,ie)=>{ const z=(ie%j)-(j-1)/2, w=Math.floor(ie/j)-(rc-1)/2; o.offset={x:z*L,y:w*L}; o.view='filter'; });
  cards.forEach(o=>setActive(o,o.filterActive));
  applyView('filter');
}
filterBox.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b&&!transitioning) columnClick(b.dataset.k,b.dataset.v); });

/* ---- back to default (their Esc / Clear) ---- */
function reset(){
  if(view==='default'||transitioning) return;
  focus=null; selected=null; sel=[]; drill=null; syncFilterButtons(); links=[]; svg.innerHTML='';
  cards.forEach(o=>{ o.expanded=false; o.filterActive=false; o.view='default'; o.offset={x:0,y:0};
                     o.rows.forEach(r=>r.classList.remove('linked')); setActive(o,true); });
  applyView('default');
}
/* no Очистить button (removed 22 Sep at the user's request): Esc and a click
   on empty space step back instead */
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!transitioning) back(); });

/* ---- intro (their Me) ---- */
function intro(){
  introDone=true;
  zoom.target=zoom.floor; slider.value=zoom.target;
  cards.forEach(c=>{
    const d=Math.random()*(cards.length*.75)*.0015;
    to(c.U,{s:1},{duration:1.5,delay:d,ease:'expo.out'});
    to(c.vl,{v:0},{duration:1.75,delay:d,ease:'power1.inOut'});
  });
}
Promise.all(cards.map(c=>c.img.complete?Promise.resolve():new Promise(r=>{ c.img.onload=r; c.img.onerror=r; }))).then(intro);

/* ---- the frame ---- */
/* the categories stand 10px under the site sections, as the shop's gender filter does */
function placeCats(){
  const nav=document.querySelector('header .sitenav'); if(!nav) return;
  document.documentElement.style.setProperty('--catTop', Math.round(nav.getBoundingClientRect().bottom+10)+'px');
}
placeCats(); layout();
/* every re-layout re-reads the stage's box first: on a phone it grows after
   this script has run (the mobile style block and FLOOR_JS come later in
   the file), and a layout for the old box would leave the field short */
function relayout(){ metrics(); anchorCentre(); placeCats(); layout(); }
addEventListener('load',relayout); if(document.fonts) document.fonts.ready.then(relayout);
setTimeout(relayout,600); setTimeout(relayout,1500);
addEventListener('resize',()=>{ metrics(); anchorCentre(); placeCats(); layout(); });
/* the stage's box changes without a resize event: on a phone mobile.py's
   FLOOR_JS sets --inT/--inB after this script has run, and the stage grows
   to the screen — the field is laid out again for it */
let roW=0, roH=0;
if(window.ResizeObserver) new ResizeObserver(()=>{ const w=stage.clientWidth, h=stage.clientHeight; if(w===roW&&h===roH) return; roW=w; roH=h; relayout(); }).observe(stage);   /* anchorCentre: the intro zoom must be anchored at the NEW centre */
function frame(now){
  stepTweens(now);
  if(pendingBack&&!transitioning){ pendingBack=false; if(view!=='default') back(); }
  if(vid.card&&!(focus&&focus.card===vid.card)) stopVideo();   // focus left by any road

  const zPrev=zoom.cur;
  zoom.cur=lerp(zoom.cur,zoom.target,.15);
  if(zoom.cur!==zPrev){
    /* keep the anchored screen point on the same world point through the
       ease: pan shifts by (anchor − centre)·(1/z₂ − 1/z₁), current and target alike */
    const k=1/zoom.cur-1/zPrev, dx=(anchor.x-vw/2)*k, dy=(anchor.y-vh/2)*k;
    pan.x+=dx; pan.tx+=dx; pan.y+=dy; pan.ty+=dy;
  }
  if(!pan.locked){ const k=fine?.0625:.1; pan.x=lerp(pan.x,pan.tx,k); pan.y=lerp(pan.y,pan.ty,k); }
  world.style.transform=`translate(${(vw/2+pan.x*zoom.cur).toFixed(2)}px,${(vh/2+pan.y*zoom.cur).toFixed(2)}px) scale(${zoom.cur.toFixed(4)})`;
  for(const c of cards){
    if(fine){
      c.ee.x=lerp(c.ee.x,((mouse.x*.35)/zoom.target)*(DIST/3)*c.sc.v,.035)*c.ee.f;
      c.ee.y=lerp(c.ee.y,((mouse.y*.35)/zoom.target)*(DIST/3)*c.sc.v,.035)*c.ee.f;
      c.X.lerp.x=lerp(c.X.lerp.x,c.X.cur.x,.1); c.X.lerp.y=lerp(c.X.lerp.y,c.X.cur.y,.1);
    } else { c.X.lerp.x=c.X.cur.x; c.X.lerp.y=c.X.cur.y; }
    cardPos(c); paint(c);
  }
  if(links.length) drawLinks(false);
  requestAnimationFrame(frame);
}
cards.forEach(c=>{ cardPos(c); paint(c); });
requestAnimationFrame(frame);
/* a handle for testing from the console; nothing on the page uses it */
window.__ed={pan,drag,zoom,cards,st:()=>({transitioning,view,sliderActive,hovered:hovered?hovered.i:null,locked:pan.locked})};
})();
</script>
<script>
/* The Меню panel. Built from what the page's own header already carries: the
   button is the only thing added, and the rows it shows are the page's own
   elements, hidden by CSS and shown again — never cloned, so the listeners on
   the gender filter, the search link and the page's tools all survive.
   See _src/mobile.py. */
(function(){
  const hdr = document.querySelector('header');
  if(!hdr || hdr.querySelector('.mbtn')) return;
  const mq = matchMedia('(max-width:900px)');

  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'mbtn';
  btn.setAttribute('aria-expanded', 'false');
  /* the menu mark, assets/icons/menu.svg, inline so the page stays one file and
     the mark takes the ink colour; the word it replaced is its label */
  const MARK = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8.4 9.71" aria-hidden="true" focusable="false">'
    + '<path d="M8.4,3.24h-.02l-.76-1.04H.78L.02,3.24h-.02V0h.02l.72,1h6.91l.72-1h.02v3.24Z"/>'
    + '<path d="M8.4,6.48h-.02l-.76-1.04H.78L.02,6.48H0v-3.24h.02l.72,1h6.91l.72-1h.02v3.24Z"/>'
    + '<path d="M8.4,9.71h-.02l-.76-1.04H.78L.02,9.71H0v-3.24h.02l.72,1h6.91l.72-1h.02v3.24Z"/></svg>';
  /* the close mark: the lattice's cross — the page tile's two bowed strokes —
     turned 45°. The hidden full stop keeps the button a line of type tall. */
  const XMARK = '<span class="xhold" aria-hidden="true">.</span>'
    + '<svg class="xmark" xmlns="http://www.w3.org/2000/svg" viewBox="5.5 5.5 13 13" aria-hidden="true" focusable="false">'
    + '<g transform="rotate(45 12 12)" fill="none" stroke="currentColor" stroke-linecap="round">'
    + '<path d="M12 3.6C12.15 8.4 12.15 15.6 12 20.4"/><path d="M3.6 12C8.4 11.85 15.6 11.85 20.4 12"/></g></svg>';
  btn.innerHTML = MARK;
  btn.setAttribute('aria-label', 'Меню');
  hdr.insertBefore(btn, hdr.firstChild);

  /* A cart shortcut in the bar, on EVERY page (21 Sep, user's call: the bar of
     the shop — mark, wordmark, Корзина — is the bar of the site). Where the
     desktop header has a cart link the shortcut is read off it; the archive,
     the cart, the checkout and the editorial pages have none on the desktop,
     so theirs is made here, counting the cart page's own lines where there
     are any. */
  const src = hdr.querySelector('.right a[href*="cart"]');
  const a = document.createElement('a');
  a.className = 'mcart';
  if(src){
    a.href = src.getAttribute('href');
    a.textContent = src.textContent.trim();
    /* the bar now carries the cart, so the row it was copied from is marked
       and left out of the panel — the same control twice reads as two */
    (src.closest('.seg') || src).classList.add('mcart-src');
  } else {
    a.href = /\/final1\//.test(location.pathname) ? '../drafts/cart.html' : 'cart.html';
    /* the prototype's cart holds the two lines cart.html draws; the checkout
       is that same cart one step on, and it lists no lines of its own to count */
    const n = /checkout/.test(location.pathname) ? 2 : document.querySelectorAll('main .line').length;
    a.textContent = 'Корзина (' + n + ')';
  }
  hdr.appendChild(a);

  /* Search happens IN the panel (21 Sep, user's call): Поиск opened the shop's
     filter modal, a second sheet over this one. On a phone the Поиск box turns
     into the line itself. On the shop it drives the page's own search input
     (#q), so the grid, the count and «Сбросить фильтры» all follow as they do
     from the modal; on the pages whose Поиск is a link to the shop (product,
     archive piece, states) it carries the words there as `?q=`, which the
     shop reads below. The desktop is untouched: over 900px the link is let
     through to the page's own handler. */
  const slink = hdr.querySelector('.right a[href*="search"]');
  const pageQ = document.getElementById('q');
  let searchState = () => {};
  if(slink){
    const sseg = slink.closest('.seg') || slink;
    const form = document.createElement('form');
    form.className = 'msearch'; form.setAttribute('role', 'search');
    form.innerHTML = '<input type="search" placeholder="Найти" aria-label="Поиск"'
      + ' autocomplete="off" spellcheck="false" enterkeyhint="search">'
      + '<div class="msearch-foot"><span class="msearch-n" aria-live="polite"></span>'
      + '<button type="submit">Показать</button></div>';
    sseg.parentNode.insertBefore(form, sseg.nextSibling);
    const inp = form.querySelector('input'), cnt = form.querySelector('.msearch-n');
    const show = on => { form.classList.toggle('on', on); sseg.classList.toggle('msearch-src', on); };
    const count = () => {
      const c = document.getElementById('fcount');
      cnt.textContent = pageQ && c && inp.value.trim() ? c.textContent : '';
    };
    /* capture, and stopped here: the shop's own listener on the link would
       open the modal, and the panel's would close the panel */
    hdr.addEventListener('click', e => {
      if(!mq.matches || e.target.closest('a') !== slink) return;
      e.preventDefault(); e.stopPropagation();
      show(true); inp.focus();
    }, true);
    inp.addEventListener('input', () => {
      if(!pageQ) return;
      pageQ.value = inp.value; pageQ.dispatchEvent(new Event('input'));
      count();
    });
    form.addEventListener('submit', e => {
      e.preventDefault();
      const v = inp.value.trim();
      if(pageQ){ inp.blur(); open(false); scrollTo(0, 0); return; }
      if(!v) return;
      const u = new URL(slink.href); u.hash = ''; u.search = '';
      u.searchParams.set('q', v);
      location.href = u.href;
    });
    /* an empty line goes back to being the Поиск box when the panel closes; a
       line with words in it is still there, and still editable, on the next
       open — read back off the page's own input, which «Сбросить фильтры»
       in the filter modal may have emptied in the meantime */
    searchState = on => {
      if(on && pageQ && inp.value !== pageQ.value){ inp.value = pageQ.value; count(); }
      if(!inp.value.trim()) show(false);
    };
    const q0 = new URLSearchParams(location.search).get('q');
    if(pageQ && q0){
      inp.value = pageQ.value = q0; pageQ.dispatchEvent(new Event('input'));
      show(true); count();
    }
  }

  function open(on){
    hdr.classList.toggle('menu-open', on);
    document.documentElement.classList.toggle('menu-lock', on);
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
    if(on){ btn.innerHTML = XMARK; btn.setAttribute('aria-label', 'Закрыть'); }
    else { btn.innerHTML = MARK; btn.setAttribute('aria-label', 'Меню'); }
    searchState(on);
  }
  btn.addEventListener('click', () => open(!hdr.classList.contains('menu-open')));
  /* any link inside the panel closes it — a same-page anchor would otherwise
     leave it standing open. Поиск is the exception, stopped in capture above:
     it is used inside the panel */
  hdr.addEventListener('click', e => {
    if(e.target !== btn && e.target.closest('a')) open(false);
  });
  addEventListener('keydown', e => { if(e.key === 'Escape') open(false); });
  /* and on a rotation: the page's own reserve() re-measures the header on
     resize, and an open panel is 100svh tall — it would set --headerH, which
     positions everything, to the whole screen */
  /* — a rotation, not any resize: a phone's keyboard coming up for the search
     line resizes the window on some browsers, and changes only its height */
  let lastW = innerWidth;
  addEventListener('resize', () => {
    if(innerWidth === lastW) return;
    lastW = innerWidth;
    if(hdr.classList.contains('menu-open')) open(false);
  });

  /* The page's own head row lives inside the header on the desktop (the cart,
     the checkout and the text page put their h1 there). Behind the button it
     would be invisible, so on a phone it moves to the top of <main>. Moved,
     not copied: .phead carries buttons with listeners on them. */
  const slot = hdr.querySelector('.slot');
  const phead = hdr.querySelector('.phead');
  const main = document.querySelector('main');
  function place(){
    if(!phead || !main || !slot) return;
    if(mq.matches){ if(phead.parentNode !== main) main.insertBefore(phead, main.firstChild); }
    else if(phead.parentNode !== slot){ slot.appendChild(phead); }
  }
  /* The gender filter is not in the panel (21 Sep, user's call). On the shop it
     stands in the head row with Фильтр and Сортировать, set like them; on
     every other page that carries it — the product page — it is simply not
     shown on a phone. Moved, not copied, as above; and back again over 900px.
     The shop's own click handler clears aria-current through
     `header .slot .seg a`, which finds nothing once the row has left the
     header, so the clearing is repeated here on the row itself. */
  const gseg = hdr.querySelector('.slot .seg');
  const tools = document.querySelector('.gridhead .tools');
  function placeGender(){
    if(!gseg || !tools || !slot) return;
    if(mq.matches){ if(gseg.parentNode !== tools) tools.insertBefore(gseg, tools.firstChild); }
    else if(gseg.parentNode !== slot){ slot.appendChild(gseg); }
  }
  if(gseg && tools) gseg.addEventListener('click', e => {
    const hit = e.target.closest('a');
    if(!hit) return;
    gseg.querySelectorAll('a').forEach(x => { if(x !== hit) x.removeAttribute('aria-current'); });
  });
  function sync(){ if(!mq.matches) open(false); place(); placeGender(); }
  mq.addEventListener('change', sync);
  sync();

  /* the shop's filter modal, on the pages that have one */
  const pane = document.getElementById('pane');
  if(pane){
    const flag = () => document.documentElement.classList.toggle(
      'pane-modal', pane.classList.contains('modal-open'));
    new MutationObserver(flag).observe(pane, {attributes:true, attributeFilter:['class']});
    flag();
  }
})();
</script>

  function done(val){ try{ localStorage.setItem(K,val); }catch(e){} d.remove(); }
  d.querySelector('.ok').onclick=function(){ done('accepted'); };

  addEventListener('storage',function(e){ if(e.key===K && e.newValue) d.remove(); });
  /* straight before the page's crosses, at their z: the crosses come later in
     the tree in the same stacking context, so they always paint over it (pages
     z 100; publications' svg.crosses z 2, inside #page). The landing is the
     exception: its crosses lie under EVERYTHING there, words and ASCII
     included (z 0 < plate 5 < hero 10), so the notice follows the landing's
     own rule and sits over the hero, where it can be clicked */

  while(A && A.parentElement!==document.body) A=A.parentElement;

    var z=getComputedStyle(L).zIndex; d.style.zIndex=(z==='auto'?'0':z); A.before(d); }
  else { if(L) d.style.zIndex='11'; document.body.appendChild(d); }
